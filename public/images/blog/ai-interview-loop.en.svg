<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="From the question to evidence">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a78bfa"/></marker></defs>
<style>.number,.label,.detail,.sub,.foot{font-family:ui-monospace,monospace}.number{font-size:13px;fill:#a78bfa}.label{font-size:17px;fill:#ece7fb}.detail,.sub{font-size:12px;fill:#a99dc9}.foot{font-size:15px;fill:#34d399}.flow{stroke-dasharray:5 5;animation:dash 1s linear infinite}.card{animation:pulse 5s ease-in-out infinite}.c1{animation-delay:.5s}.c2{animation-delay:1s}.c3{animation-delay:1.5s}@keyframes dash{to{stroke-dashoffset:-20}}@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}</style>
<rect width="1000" height="460" fill="url(#bg)"/><text x="36" y="58" font-family="Georgia,serif" font-size="30" fill="#ece7fb">From the question to evidence</text><text x="37" y="88" class="sub">A GUIDE TO WORKING WITH AGENTS</text><g class="card c0"><rect x="35" y="150" width="205" height="130" rx="15" fill="#181329" stroke="#62518f" stroke-width="2"/><text x="55" y="180" class="number">01</text><text x="55" y="218" class="label">Define</text><text x="55" y="248" class="detail">goal and limits</text></g><path class="flow" d="M244 215 h25" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/><g class="card c1"><rect x="275" y="150" width="205" height="130" rx="15" fill="#181329" stroke="#62518f" stroke-width="2"/><text x="295" y="180" class="number">02</text><text x="295" y="218" class="label">Add context</text><text x="295" y="248" class="detail">relevant information</text></g><path class="flow" d="M484 215 h25" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/><g class="card c2"><rect x="515" y="150" width="205" height="130" rx="15" fill="#181329" stroke="#62518f" stroke-width="2"/><text x="535" y="180" class="number">03</text><text x="535" y="218" class="label">Verify</text><text x="535" y="248" class="detail">tests and review</text></g><path class="flow" d="M724 215 h25" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/><g class="card c3"><rect x="755" y="150" width="205" height="130" rx="15" fill="#181329" stroke="#62518f" stroke-width="2"/><text x="775" y="180" class="number">04</text><text x="775" y="218" class="label">Decide</text><text x="775" y="248" class="detail">human accountability</text></g><rect x="35" y="335" width="930" height="68" rx="12" fill="#142222" stroke="#34d399"/><text x="58" y="376" class="foot">If something fails: contain → recover → learn</text></svg>

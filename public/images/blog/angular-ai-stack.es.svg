<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="El MCP oficial, las skills y chalc dirigen al asistente hacia Angular idiomático, todo sobre una base de documentación viva">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
    .core { transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
    .feed { transform-box: fill-box; transform-origin: center; animation: float 5s ease-in-out infinite; }
    .f2 { animation-delay: -1.6s } .f3 { animation-delay: -3.2s }
    .wire { stroke-dasharray: 5 8; animation: flow 1.8s linear infinite; }
    .base { animation: glow 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity:.92 } 50% { transform: scale(1.06); opacity:1 } }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @keyframes flow { to { stroke-dashoffset: -52 } }
    @keyframes glow { 0%,100% { stroke-opacity:.5 } 50% { stroke-opacity:1 } }
  </style>

  <rect width="1000" height="520" fill="url(#bg)"/>
  <text x="40" y="44" font-family="Georgia, serif" font-size="26" fill="#ece7fb">Tres cosas que uso para dirigir la IA en Angular</text>
  <text x="40" y="70" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">MCP, skills y chalc · todo sobre documentación viva</text>

  <!-- feeders -->
  <g class="feed">
    <rect x="60" y="104" width="220" height="86" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text x="80" y="132" font-size="16">🔌</text>
    <text x="106" y="134" font-family="ui-monospace, monospace" font-size="13" fill="#a78bfa">MCP OFICIAL</text>
    <text x="80" y="158" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">la versión de HOY,</text>
    <text x="80" y="174" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">no la que recuerda</text>
  </g>
  <g class="feed f2">
    <rect x="390" y="104" width="220" height="86" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text x="410" y="132" font-size="16">📚</text>
    <text x="436" y="134" font-family="ui-monospace, monospace" font-size="13" fill="#a78bfa">SKILLS</text>
    <text x="410" y="158" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">el «cómo» idiomático,</text>
    <text x="410" y="174" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">una ficha por tarea</text>
  </g>
  <g class="feed f3">
    <rect x="720" y="104" width="220" height="86" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text x="740" y="132" font-size="16">⚙️</text>
    <text x="766" y="134" font-family="ui-monospace, monospace" font-size="13" fill="#a78bfa">chalc + MÉTODO</text>
    <text x="740" y="158" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">lo reparte y ordena:</text>
    <text x="740" y="174" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">spec → test → código</text>
  </g>

  <line x1="170" y1="192" x2="440" y2="286" class="wire" stroke="#a78bfa" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="500" y1="192" x2="500" y2="286" class="wire" stroke="#a78bfa" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="830" y1="192" x2="560" y2="286" class="wire" stroke="#a78bfa" stroke-width="2" marker-end="url(#ar)"/>

  <!-- assistant -->
  <g class="core">
    <circle cx="500" cy="330" r="58" fill="none" stroke="url(#ac)" stroke-width="2.5"/>
    <text x="500" y="326" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#ece7fb">asistente</text>
    <text x="500" y="346" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">dirigido, no suelto</text>
  </g>

  <!-- output -->
  <line x1="560" y1="330" x2="700" y2="330" class="wire" stroke="#34d399" stroke-width="2.2" marker-end="url(#ag)"/>
  <rect x="704" y="300" width="240" height="60" rx="12" fill="rgba(52,211,153,0.05)" stroke="#34d399" stroke-width="2.2"/>
  <text x="724" y="326" font-family="ui-monospace, monospace" font-size="12.5" fill="#34d399">código idiomático</text>
  <text x="724" y="346" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">standalone · signals · inject()</text>

  <!-- base: documentación -->
  <rect class="base" x="60" y="426" width="880" height="66" rx="14" fill="rgba(167,139,250,0.05)" stroke="#a78bfa" stroke-width="2"/>
  <text x="500" y="454" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#ece7fb">📐 documentación viva — la base que sostiene todo</text>
  <text x="500" y="476" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#8a7fb0">docs/architecture.md · README.md en cada carpeta (core · shared · features)</text>
  <line x1="500" y1="392" x2="500" y2="422" class="wire" stroke="#a78bfa" stroke-width="2" marker-end="url(#ar)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="A single terminal window split into panes. The large pane on the left runs the live dashboard, with one row per side of each story: branch, task progress bar, clean or dirty tree, commits over the base, last commit and the task in progress; below it, the activity log. On the right, one pane per story, each sitting in its folder and waiting for you to type your agent command. The board only reads two sources that already existed, the tasks.md file and git, refreshing every five seconds, always read-only over localhost.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <style>
    .flow { stroke-dasharray: 6 8; animation: dash 2.3s linear infinite; }
    .f2 { animation-duration: 3s; }
    .bar { animation: grow 7s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    .bar2 { animation: grow2 7s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    .caret { animation: caret 1.1s steps(1) infinite; }
    .tick { animation: tick 5s ease-in-out infinite; }
    .t2 { animation-delay: 2.4s; }
    .live { animation: breathe 5s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -56; } }
    @keyframes grow { 0%, 100% { transform: scaleX(.58); } 55% { transform: scaleX(.72); } }
    @keyframes grow2 { 0%, 100% { transform: scaleX(.3); } 70% { transform: scaleX(.42); } }
    @keyframes caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes tick { 0%, 70% { opacity: 0; } 80%, 100% { opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  </style>

  <rect width="1000" height="560" fill="url(#bg)"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="28" fill="#ece7fb">The command center</text>
  <text x="40" y="72" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">chalc dashboard --console — one window: the live board on the left, one desk per story on the right</text>

  <!-- window -->
  <rect x="40" y="96" width="920" height="352" rx="14" fill="none" stroke="#453768" stroke-width="2"/>
  <circle cx="64" cy="118" r="4.5" fill="#fb7185"/><circle cx="80" cy="118" r="4.5" fill="#a78bfa"/><circle cx="96" cy="118" r="4.5" fill="#34d399"/>
  <text x="116" y="122" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">Windows Terminal · one window, one pane per story</text>
  <line x1="40" y1="134" x2="960" y2="134" stroke="#2a2140" stroke-width="1"/>

  <!-- dashboard pane -->
  <rect x="56" y="148" width="520" height="284" rx="10" fill="none" stroke="url(#ac)" stroke-width="2"/>
  <text x="74" y="172" font-family="ui-monospace, monospace" font-size="11" fill="#a78bfa">⚙ dashboard</text>
  <text x="558" y="172" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0" class="live">http://localhost:4321 · every 5 s</text>
  <line x1="74" y1="182" x2="558" y2="182" stroke="#2a2140" stroke-width="1"/>

  <text x="74" y="204" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">016-descuento-por-volumen</text>
  <text x="558" y="204" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#7cc4ff">in progress</text>
  <text x="88" y="226" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">back</text>
  <rect x="130" y="218" width="180" height="8" rx="4" fill="#2a2140"/>
  <rect x="130" y="218" width="180" height="8" rx="4" fill="#34d399" class="bar"/>
  <text x="322" y="226" font-family="ui-monospace, monospace" font-size="9" fill="#ece7fb">7/12</text>
  <text x="370" y="226" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">clean</text>
  <text x="424" y="226" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">↑5 · feat(pedidos): …</text>
  <text x="130" y="244" font-family="ui-monospace, monospace" font-size="9" fill="#7cc4ff">→ failing test for the 409 when the discount already exists (R4)</text>

  <text x="88" y="270" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">front</text>
  <rect x="130" y="262" width="180" height="8" rx="4" fill="#2a2140"/>
  <rect x="130" y="262" width="180" height="8" rx="4" fill="#34d399" class="bar2"/>
  <text x="322" y="270" font-family="ui-monospace, monospace" font-size="9" fill="#ece7fb">3/10</text>
  <text x="370" y="270" font-family="ui-monospace, monospace" font-size="9" fill="#fbbf24">has changes</text>
  <text x="452" y="270" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">↑2 · feat(web): …</text>
  <text x="130" y="288" font-family="ui-monospace, monospace" font-size="9" fill="#7cc4ff">→ form state with signals (R6)</text>

  <text x="74" y="316" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">017-historial-de-pedidos</text>
  <text x="558" y="316" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">not started</text>
  <text x="88" y="338" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">back</text>
  <rect x="130" y="330" width="180" height="8" rx="4" fill="#2a2140"/>
  <text x="322" y="338" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">0/9</text>
  <text x="88" y="358" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">front</text>
  <rect x="130" y="350" width="180" height="8" rx="4" fill="#2a2140"/>
  <text x="322" y="358" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">0/8</text>

  <line x1="74" y1="378" x2="558" y2="378" stroke="#2a2140" stroke-width="1"/>
  <text x="74" y="398" font-family="ui-monospace, monospace" font-size="9" fill="#a78bfa">activity</text>
  <text x="74" y="416" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0" class="tick">10:14:32  016 · back — task completed: discount contract (R1)</text>
  <text x="74" y="432" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0" class="tick t2">10:16:05  016 · front — new commit: feat(web): discount form</text>

  <!-- work panes -->
  <rect x="592" y="148" width="352" height="134" rx="10" fill="none" stroke="#453768" stroke-width="1.8"/>
  <text x="610" y="172" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">016-descuento-por-volumen</text>
  <line x1="610" y1="182" x2="926" y2="182" stroke="#2a2140" stroke-width="1"/>
  <text x="610" y="204" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">PS D:\proyectos\chalc-workspaces\016-…&gt;</text>
  <text x="610" y="226" font-family="ui-monospace, monospace" font-size="11" fill="#a78bfa">claude<tspan class="caret" fill="#ece7fb">▋</tspan></text>
  <text x="610" y="252" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">chalc opens the pane · you type the command</text>
  <text x="610" y="270" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">handoff.md and the specs are already inside</text>

  <rect x="592" y="298" width="352" height="134" rx="10" fill="none" stroke="#453768" stroke-width="1.8"/>
  <text x="610" y="322" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">017-historial-de-pedidos</text>
  <line x1="610" y1="332" x2="926" y2="332" stroke="#2a2140" stroke-width="1"/>
  <text x="610" y="354" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">PS D:\proyectos\chalc-workspaces\017-…&gt;</text>
  <text x="610" y="376" font-family="ui-monospace, monospace" font-size="11" fill="#a78bfa">codex<tspan class="caret" fill="#ece7fb">▋</tspan></text>
  <text x="610" y="402" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">claude · codex · opencode · gemini — whichever you use</text>
  <text x="610" y="420" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">chalc never launches the agent on its own</text>

  <!-- where the data comes from -->
  <rect x="56" y="486" width="200" height="52" rx="10" fill="none" stroke="#453768" stroke-width="1.5"/>
  <text x="72" y="508" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">specs\NNN-slug\tasks.md</text>
  <text x="72" y="526" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">ticked boxes / total</text>
  <rect x="284" y="486" width="200" height="52" rx="10" fill="none" stroke="#453768" stroke-width="1.5"/>
  <text x="300" y="508" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">git status · rev-list</text>
  <text x="300" y="526" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">branch · tree · commits</text>
  <path d="M156 482 V 440" class="flow" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M384 482 V 440" class="flow f2" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="512" y="502" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">read-only by construction</text>
  <text x="512" y="520" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">GET only · listens on 127.0.0.1 · zero dependencies</text>
  <text x="512" y="538" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">never modifies repos, never spawns processes, never deletes</text>
</svg>

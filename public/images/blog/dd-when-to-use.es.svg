<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="Cuándo usar cada técnica y cuándo no">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/></linearGradient>
  </defs>
  <style>
    .pulse { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d1 { animation-delay: .4s; } .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.2s; } .d4 { animation-delay: 1.6s; }
    @keyframes pulse { 0%, 100% { opacity: .8; } 50% { opacity: 1; } }
    .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .blink { animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  </style>
  <rect width="1000" height="460" fill="url(#bg)"/>
  <text x="40" y="44" font-family="Georgia, serif" font-size="27" fill="#ece7fb">Cuánto detalle necesita el problema</text>
  <text x="40" y="70" font-family="ui-monospace, monospace" font-size="13.5" fill="#8a7fb0">empieza por el problema, no por la sigla</text>
  <text x="60" y="112" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0" text-anchor="start" font-weight="normal">EL PROBLEMA</text><text x="470" y="112" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0" text-anchor="start" font-weight="normal">ME AYUDA CON…</text><text x="740" y="112" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0" text-anchor="start" font-weight="normal">ADAPTO EL ESFUERZO</text>
  <g class="pulse d1">
    <rect x="40" y="126" width="920" height="60" rx="10" fill="#14101f" stroke="#453768" stroke-width="1.5"/>
    <text x="60" y="162" font-family="Georgia, serif" font-size="20" fill="#a78bfa" text-anchor="start" font-weight="normal">DDD</text>
    <text x="130" y="152" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb" text-anchor="start" font-weight="normal">Los términos son ambiguos</text>
    <text x="130" y="172" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0" text-anchor="start" font-weight="normal">negocio y código hablan idiomas distintos</text>
    <text x="470" y="162" font-family="ui-monospace, monospace" font-size="12" fill="#34d399" text-anchor="start" font-weight="normal">modelos con reglas complejas</text>
    <text x="740" y="162" font-family="ui-monospace, monospace" font-size="12" fill="#fb7185" text-anchor="start" font-weight="normal">modelo ligero si basta</text>
  </g>
  <g class="pulse d2">
    <rect x="40" y="198" width="920" height="60" rx="10" fill="#14101f" stroke="#453768" stroke-width="1.5"/>
    <text x="60" y="234" font-family="Georgia, serif" font-size="20" fill="#a78bfa" text-anchor="start" font-weight="normal">BDD</text>
    <text x="130" y="224" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb" text-anchor="start" font-weight="normal">¿Es lo que pidió el negocio?</text>
    <text x="130" y="244" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0" text-anchor="start" font-weight="normal">falta un ejemplo que todos lean</text>
    <text x="470" y="234" font-family="ui-monospace, monospace" font-size="12" fill="#34d399" text-anchor="start" font-weight="normal">ejemplos acordados</text>
    <text x="740" y="234" font-family="ui-monospace, monospace" font-size="12" fill="#fb7185" text-anchor="start" font-weight="normal">BDD sin exigir Cucumber</text>
  </g>
  <g class="pulse d3">
    <rect x="40" y="270" width="920" height="60" rx="10" fill="#14101f" stroke="#453768" stroke-width="1.5"/>
    <text x="60" y="306" font-family="Georgia, serif" font-size="20" fill="#a78bfa" text-anchor="start" font-weight="normal">SDD</text>
    <text x="130" y="296" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb" text-anchor="start" font-weight="normal">La IA puede asumir lo no definido</text>
    <text x="130" y="316" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0" text-anchor="start" font-weight="normal">nadie recuerda qué debía hacer</text>
    <text x="470" y="306" font-family="ui-monospace, monospace" font-size="12" fill="#34d399" text-anchor="start" font-weight="normal">alcance y trazabilidad</text>
    <text x="740" y="306" font-family="ui-monospace, monospace" font-size="12" fill="#fb7185" text-anchor="start" font-weight="normal">spec breve al explorar</text>
  </g>
  <g class="pulse d4">
    <rect x="40" y="342" width="920" height="60" rx="10" fill="#14101f" stroke="#453768" stroke-width="1.5"/>
    <text x="60" y="378" font-family="Georgia, serif" font-size="20" fill="#a78bfa" text-anchor="start" font-weight="normal">TDD</text>
    <text x="130" y="368" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb" text-anchor="start" font-weight="normal">Necesito guiar el cambio con pruebas</text>
    <text x="130" y="388" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0" text-anchor="start" font-weight="normal">pruebas que contrasten lo esperado</text>
    <text x="470" y="378" font-family="ui-monospace, monospace" font-size="12" fill="#34d399" text-anchor="start" font-weight="normal">comportamiento y diseño</text>
    <text x="740" y="378" font-family="ui-monospace, monospace" font-size="12" fill="#fb7185" text-anchor="start" font-weight="normal">ciclos pequeños y pruebas</text>
  </g>
</svg>

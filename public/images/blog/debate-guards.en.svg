<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="The four checks that stop the debate from closing out of politeness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
  </defs>
  <style>
    .card { animation: pop 8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .c2 { animation-delay: .7s; } .c3 { animation-delay: 1.4s; } .c4 { animation-delay: 2.1s; }
    .no { animation: blink 2.6s ease-in-out infinite; }
    .flow { stroke-dasharray: 5 7; animation: dash 1.6s linear infinite; }
    @keyframes pop { 0%, 100% { opacity: .8; transform: translateY(0); } 6% { opacity: 1; transform: translateY(-4px); } 20% { opacity: .96; } }
    @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes dash { to { stroke-dashoffset: -48; } }
  </style>

  <rect width="1000" height="460" fill="url(#bg)"/>
  <text x="40" y="50" font-family="Georgia, serif" font-size="29" fill="#ece7fb">Agreement has to be earned</text>
  <text x="40" y="78" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0">four checks made while reading each turn · the model is never merely asked nicely</text>

  <g class="card">
    <rect x="40" y="108" width="450" height="118" rx="14" fill="#a78bfa" fill-opacity=".06" stroke="#453768" stroke-width="1.5"/>
    <text x="66" y="142" font-family="ui-monospace, monospace" font-size="15" fill="#a78bfa">1 · Anonymity</text>
    <text x="66" y="172" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">Each side gets the other's full turn,</text>
    <text x="66" y="194" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">with no idea which model or provider wrote it.</text>
    <text x="66" y="214" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">nobody backs down just because a bigger model is across the table</text>
  </g>

  <g class="card c2">
    <rect x="510" y="108" width="450" height="118" rx="14" fill="#a78bfa" fill-opacity=".06" stroke="#453768" stroke-width="1.5"/>
    <text x="536" y="142" font-family="ui-monospace, monospace" font-size="15" fill="#a78bfa">2 · Earned agreement</text>
    <text x="536" y="172" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">If an "I agree" fails to name which objection</text>
    <text x="536" y="194" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">it settles, and why, it is thrown out.</text>
    <g class="no">
      <text x="536" y="214" font-family="ui-monospace, monospace" font-size="11" fill="#fb7185">discarded → the debate goes on</text>
    </g>
  </g>

  <g class="card c3">
    <rect x="40" y="246" width="450" height="118" rx="14" fill="#a78bfa" fill-opacity=".06" stroke="#453768" stroke-width="1.5"/>
    <text x="66" y="280" font-family="ui-monospace, monospace" font-size="15" fill="#a78bfa">3 · Minimum round</text>
    <text x="66" y="310" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">No closing by agreement until the proposal</text>
    <text x="66" y="332" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">has passed back through its author.</text>
    <text x="66" y="352" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">caving on the first turn is not convergence: it is not having done the work</text>
  </g>

  <g class="card c4">
    <rect x="510" y="246" width="450" height="118" rx="14" fill="#a78bfa" fill-opacity=".06" stroke="#453768" stroke-width="1.5"/>
    <text x="536" y="280" font-family="ui-monospace, monospace" font-size="15" fill="#a78bfa">4 · Real dissent</text>
    <text x="536" y="310" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">A debate where nobody ever objected</text>
    <text x="536" y="332" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">cannot be closed by agreement.</text>
    <text x="536" y="352" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">two models agreeing from the start are a monologue in two voices</text>
  </g>

  <line x1="40" y1="392" x2="960" y2="392" class="flow" stroke="#453768" stroke-width="1.5"/>
  <text x="40" y="424" font-family="ui-monospace, monospace" font-size="12.5" fill="#8a7fb0">On top of that: a different side opens each round, and the report picks no winner — whatever stayed open comes back to you to decide.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="Los cuatro frenos que impiden que el debate cierre por complacencia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
  </defs>
  <style>
    .card { animation: pop 8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .c2 { animation-delay: .7s; } .c3 { animation-delay: 1.4s; } .c4 { animation-delay: 2.1s; }
    .no { animation: blink 2.6s ease-in-out infinite; }
    .flow { stroke-dasharray: 5 7; animation: dash 1.6s linear infinite; }
    @keyframes pop { 0%, 100% { opacity: .8; transform: translateY(0); } 6% { opacity: 1; transform: translateY(-4px); } 20% { opacity: .96; } }
    @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes dash { to { stroke-dashoffset: -48; } }
  </style>

  <rect width="1000" height="460" fill="url(#bg)"/>
  <text x="40" y="50" font-family="Georgia, serif" font-size="29" fill="#ece7fb">El acuerdo hay que ganárselo</text>
  <text x="40" y="78" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0">cuatro comprobaciones al leer cada turno · no se le piden por favor al modelo</text>

  <g class="card">
    <rect x="40" y="108" width="450" height="118" rx="14" fill="#a78bfa" fill-opacity=".06" stroke="#453768" stroke-width="1.5"/>
    <text x="66" y="142" font-family="ui-monospace, monospace" font-size="15" fill="#a78bfa">1 · Anonimato</text>
    <text x="66" y="172" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">Cada lado recibe el turno entero del otro,</text>
    <text x="66" y="194" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">sin saber qué modelo ni qué proveedor lo escribió.</text>
    <text x="66" y="214" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">nadie se calla porque enfrente haya un modelo más grande</text>
  </g>

  <g class="card c2">
    <rect x="510" y="108" width="450" height="118" rx="14" fill="#a78bfa" fill-opacity=".06" stroke="#453768" stroke-width="1.5"/>
    <text x="536" y="142" font-family="ui-monospace, monospace" font-size="15" fill="#a78bfa">2 · Acuerdo justificado</text>
    <text x="536" y="172" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">Si un «estoy de acuerdo» no dice qué objeción</text>
    <text x="536" y="194" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">queda resuelta y por qué, se descarta.</text>
    <g class="no">
      <text x="536" y="214" font-family="ui-monospace, monospace" font-size="11" fill="#fb7185">descartado → el debate sigue</text>
    </g>
  </g>

  <g class="card c3">
    <rect x="40" y="246" width="450" height="118" rx="14" fill="#a78bfa" fill-opacity=".06" stroke="#453768" stroke-width="1.5"/>
    <text x="66" y="280" font-family="ui-monospace, monospace" font-size="15" fill="#a78bfa">3 · Ronda mínima</text>
    <text x="66" y="310" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">No se cierra por acuerdo hasta que la propuesta</text>
    <text x="66" y="332" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">vuelve a pasar por su autor.</text>
    <text x="66" y="352" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">ceder en el primer turno no es convergencia: es no haber trabajado</text>
  </g>

  <g class="card c4">
    <rect x="510" y="246" width="450" height="118" rx="14" fill="#a78bfa" fill-opacity=".06" stroke="#453768" stroke-width="1.5"/>
    <text x="536" y="280" font-family="ui-monospace, monospace" font-size="15" fill="#a78bfa">4 · Disenso real</text>
    <text x="536" y="310" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">Un debate en el que nadie objetó nunca</text>
    <text x="536" y="332" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">no puede cerrarse por acuerdo.</text>
    <text x="536" y="352" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">dos modelos dándose la razón son un monólogo a dos voces</text>
  </g>

  <line x1="40" y1="392" x2="960" y2="392" class="flow" stroke="#453768" stroke-width="1.5"/>
  <text x="40" y="424" font-family="ui-monospace, monospace" font-size="12.5" fill="#8a7fb0">Y encima: cada ronda la abre un lado distinto, y el informe no elige ganador — lo que quedó abierto te lo devuelve para que decidas tú.</text>
</svg>

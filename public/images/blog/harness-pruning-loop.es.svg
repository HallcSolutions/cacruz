<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Cómo podar un harness cuando sale un modelo nuevo: quitar una pieza que compensa, medir con tareas reales y devolverla solo si el resultado empeora; la verificación nunca entra en el bucle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <marker id="av" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
  </defs>
  <style>
    .flow { stroke-dasharray: 7 7; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    .step { animation: glow 6s ease-in-out infinite; }
    .t2 { animation-delay: 1.5s; } .t3 { animation-delay: 3s; } .t4 { animation-delay: 4.5s; }
    @keyframes glow { 0%,100% { stroke-opacity: .45; } 12% { stroke-opacity: 1; } 30% { stroke-opacity: .45; } }
    .lock { animation: breathe 3s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { stroke-opacity: .6; } 50% { stroke-opacity: 1; } }
  </style>

  <rect width="1000" height="470" fill="url(#bg)"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="29" fill="#ece7fb">Cómo podar el harness cuando sale un modelo</text>
  <text x="40" y="74" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0">Una pieza a la vez y midiendo. Cortar todo de golpe no replica el rendimiento.</text>

  <g font-family="ui-monospace, monospace">
    <!-- 1 -->
    <rect class="step" x="40" y="120" width="190" height="84" rx="12" fill="#0d0b16" stroke="#a78bfa" stroke-width="2"/>
    <text x="58" y="146" font-size="12" fill="#a78bfa">1</text>
    <text x="58" y="168" font-size="13" fill="#ece7fb">Llega un modelo</text>
    <text x="58" y="186" font-size="13" fill="#ece7fb">nuevo</text>

    <line class="flow" x1="232" y1="162" x2="270" y2="162" stroke="#a78bfa" stroke-width="2" marker-end="url(#av)"/>

    <!-- 2 -->
    <rect class="step t2" x="280" y="120" width="210" height="84" rx="12" fill="#0d0b16" stroke="#a78bfa" stroke-width="2"/>
    <text x="298" y="146" font-size="12" fill="#a78bfa">2</text>
    <text x="298" y="168" font-size="13" fill="#ece7fb">Quitar UNA pieza</text>
    <text x="298" y="186" font-size="13" fill="#ece7fb">que compensa</text>

    <line class="flow" x1="492" y1="162" x2="530" y2="162" stroke="#a78bfa" stroke-width="2" marker-end="url(#av)"/>

    <!-- 3 -->
    <rect class="step t3" x="540" y="120" width="210" height="84" rx="12" fill="#0d0b16" stroke="#a78bfa" stroke-width="2"/>
    <text x="558" y="146" font-size="12" fill="#a78bfa">3</text>
    <text x="558" y="168" font-size="13" fill="#ece7fb">Correr tareas reales</text>
    <text x="558" y="186" font-size="13" fill="#ece7fb">del proyecto</text>

    <line class="flow" x1="752" y1="162" x2="790" y2="162" stroke="#a78bfa" stroke-width="2" marker-end="url(#av)"/>

    <!-- 4 decisión -->
    <polygon class="step t4" points="880,104 958,162 880,220 802,162" fill="#0d0b16" stroke="#a78bfa" stroke-width="2"/>
    <text x="880" y="158" text-anchor="middle" font-size="12" fill="#a78bfa">4</text>
    <text x="880" y="176" text-anchor="middle" font-size="13" fill="#ece7fb">¿empeoró?</text>

    <!-- sí: vuelve -->
    <path class="flow" d="M880 222 L880 270" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#ar)"/>
    <text x="892" y="250" font-size="12" fill="#fb7185">sí</text>
    <rect x="770" y="280" width="190" height="62" rx="12" fill="#fb7185" fill-opacity="0.08" stroke="#fb7185" stroke-width="1.5"/>
    <text x="865" y="306" text-anchor="middle" font-size="13" fill="#ece7fb">la pieza vuelve</text>
    <text x="865" y="326" text-anchor="middle" font-size="11" fill="#8a7fb0">hacía falta de verdad</text>

    <!-- no: se va -->
    <path class="flow" d="M802 162 C 760 250, 640 290, 560 300" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#ag)"/>
    <text x="700" y="252" font-size="12" fill="#34d399">no</text>
    <rect x="360" y="280" width="190" height="62" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.5"/>
    <text x="455" y="306" text-anchor="middle" font-size="13" fill="#ece7fb">la pieza se va</text>
    <text x="455" y="326" text-anchor="middle" font-size="11" fill="#8a7fb0">sobraba con este modelo</text>

    <!-- vuelta al paso 2 -->
    <path class="flow" d="M865 344 L865 392 L330 392 L330 214" fill="none" stroke="#8a7fb0" stroke-width="1.5" marker-end="url(#av)"/>
    <line class="flow" x1="358" y1="311" x2="332" y2="311" stroke="#8a7fb0" stroke-width="1.5"/>
    <text x="600" y="412" text-anchor="middle" font-size="11" fill="#8a7fb0">siguiente pieza ↺</text>

    <!-- fuera del bucle -->
    <rect class="lock" x="40" y="236" width="270" height="150" rx="14" fill="#34d399" fill-opacity="0.05" stroke="#34d399" stroke-width="2"/>
    <text x="62" y="264" font-size="13" fill="#34d399">🔒 nunca entra en el bucle</text>
    <text x="62" y="294" font-size="12.5" fill="#ece7fb">✓ tests</text>
    <text x="62" y="318" font-size="12.5" fill="#ece7fb">✓ permisos y sandbox</text>
    <text x="62" y="342" font-size="12.5" fill="#ece7fb">✓ evaluador separado</text>
    <text x="62" y="366" font-size="12.5" fill="#ece7fb">✓ evidencia antes de «hecho»</text>
  </g>

  <text x="500" y="442" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">Lo que compensa se poda con medición. Lo que verifica no depende de lo listo que sea el modelo.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="The two parts of a harness: what compensates for the model expires with every generation and what verifies and limits stays, while the capability ceiling rises">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <linearGradient id="cap" gradientUnits="userSpaceOnUse" x1="40" y1="400" x2="950" y2="400">
      <stop offset="0" stop-color="#8a7fb0"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/></marker>
  </defs>
  <style>
    .fade { animation: fade 8s ease-in-out infinite; }
    .f2 { animation-delay: 1s; } .f3 { animation-delay: 2s; } .f4 { animation-delay: 3s; }
    @keyframes fade { 0%,20% { opacity: 1; } 55%,80% { opacity: .18; } 100% { opacity: 1; } }
    .strike { stroke-dasharray: 300; stroke-dashoffset: 300; animation: strike 8s ease-in-out infinite; }
    .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; } .s4 { animation-delay: 3s; }
    @keyframes strike { 0%,15% { stroke-dashoffset: 300; } 45%,80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 300; } }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    .p2 { animation-delay: .5s; } .p3 { animation-delay: 1s; } .p4 { animation-delay: 1.5s; }
    @keyframes pulse { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
    .newpiece { animation: appear 8s ease-in-out infinite; }
    @keyframes appear { 0%,50% { opacity: 0; } 65%,90% { opacity: 1; } 100% { opacity: 0; } }
    .flow { stroke-dasharray: 8 8; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    .ceiling { animation: rise 8s ease-in-out infinite; }
    @keyframes rise { 0%,20% { transform: translateX(0); } 70%,90% { transform: translateX(240px); } 100% { transform: translateX(0); } }
  </style>

  <rect width="1000" height="470" fill="url(#bg)"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="29" fill="#ece7fb">What gets deleted and what stays in a harness</text>
  <text x="40" y="74" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0">"Harness" names two different things. Only one expires when the model improves.</text>

  <!-- left column: compensates -->
  <rect x="40" y="100" width="445" height="238" rx="14" fill="#fb7185" fill-opacity="0.05" stroke="#5a2b3a" stroke-width="1"/>
  <text x="64" y="132" font-family="ui-monospace, monospace" font-size="15" fill="#fb7185">Compensates for the model</text>
  <text x="461" y="132" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">expires · prune it</text>

  <g class="fade">
    <rect x="64" y="148" width="397" height="34" rx="8" fill="#0d0b16" stroke="#fb7185" stroke-opacity="0.5"/>
    <text x="80" y="170" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">"don&apos;t stop before you&apos;re done"</text>
  </g>
  <line class="strike" x1="72" y1="165" x2="372" y2="165" stroke="#fb7185" stroke-width="2"/>
  <g class="fade f2">
    <rect x="64" y="190" width="397" height="34" rx="8" fill="#0d0b16" stroke="#fb7185" stroke-opacity="0.5"/>
    <text x="80" y="212" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">mandatory task list</text>
  </g>
  <line class="strike s2" x1="72" y1="207" x2="372" y2="207" stroke="#fb7185" stroke-width="2"/>
  <g class="fade f3">
    <rect x="64" y="232" width="397" height="34" rx="8" fill="#0d0b16" stroke="#fb7185" stroke-opacity="0.5"/>
    <text x="80" y="254" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">word limit on responses</text>
  </g>
  <line class="strike s3" x1="72" y1="249" x2="372" y2="249" stroke="#fb7185" stroke-width="2"/>
  <g class="fade f4">
    <rect x="64" y="274" width="397" height="34" rx="8" fill="#0d0b16" stroke="#fb7185" stroke-opacity="0.5"/>
    <text x="80" y="296" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">context resets for "anxiety"</text>
  </g>
  <line class="strike s4" x1="72" y1="291" x2="372" y2="291" stroke="#fb7185" stroke-width="2"/>
  <text class="newpiece" x="252" y="328" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#a78bfa">+ a new one shows up: multi-day memory</text>

  <!-- right column: verifies and limits -->
  <rect x="515" y="100" width="445" height="238" rx="14" fill="#34d399" fill-opacity="0.05" stroke="#1f5646" stroke-width="1"/>
  <text x="539" y="132" font-family="ui-monospace, monospace" font-size="15" fill="#34d399">Verifies and limits</text>
  <text x="936" y="132" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">stays · you sign it</text>

  <rect class="pulse" x="539" y="148" width="397" height="34" rx="8" fill="#0d0b16" stroke="#34d399" stroke-width="1.5"/>
  <text x="555" y="170" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">✓ red test before the code</text>
  <rect class="pulse p2" x="539" y="190" width="397" height="34" rx="8" fill="#0d0b16" stroke="#34d399" stroke-width="1.5"/>
  <text x="555" y="212" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">✓ evaluator separate from the generator</text>
  <rect class="pulse p3" x="539" y="232" width="397" height="34" rx="8" fill="#0d0b16" stroke="#34d399" stroke-width="1.5"/>
  <text x="555" y="254" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">✓ permissions and sandbox</text>
  <rect class="pulse p4" x="539" y="274" width="397" height="34" rx="8" fill="#0d0b16" stroke="#34d399" stroke-width="1.5"/>
  <text x="555" y="296" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">✓ evidence before marking "done"</text>

  <!-- capability axis -->
  <text x="40" y="376" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">model capability</text>
  <line class="flow" x1="40" y1="400" x2="950" y2="400" stroke="url(#cap)" stroke-width="3" marker-end="url(#arrow)"/>
  <g font-family="ui-monospace, monospace" font-size="11.5" fill="#ece7fb" text-anchor="middle">
    <circle cx="160" cy="400" r="6" fill="#0d0b16" stroke="#8a7fb0" stroke-width="2"/><text x="160" y="426">Sonnet 4.5</text>
    <circle cx="400" cy="400" r="6" fill="#0d0b16" stroke="#9985c9" stroke-width="2"/><text x="400" y="426">Opus 4.6</text>
    <circle cx="640" cy="400" r="6" fill="#0d0b16" stroke="#a78bfa" stroke-width="2"/><text x="640" y="426">Opus 4.7</text>
    <circle cx="860" cy="400" r="7" fill="#0d0b16" stroke="#a78bfa" stroke-width="2.5"/><text x="860" y="426">Opus 5</text>
  </g>
  <g class="ceiling">
    <line x1="400" y1="360" x2="400" y2="410" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="410" y="376" font-family="ui-monospace, monospace" font-size="11.5" fill="#a78bfa">ceiling ▸</text>
  </g>
  <text x="500" y="456" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12.5" fill="#ece7fb">The ceiling rises with every model: some pieces go, others appear. Verification doesn&apos;t move.</text>
</svg>

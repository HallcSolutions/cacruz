<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Línea de tiempo de octubre de 2025 a septiembre de 2026: lo que se retiró o se declaró innecesario arriba, y lo que volvió o se declaró necesario abajo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/></marker>
  </defs>
  <style>
    .flow { stroke-dasharray: 8 8; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    .dot { animation: pulse 9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d2 { animation-delay: .5s; } .d3 { animation-delay: 1s; } .d4 { animation-delay: 1.5s; } .d5 { animation-delay: 2s; }
    .d6 { animation-delay: 2.5s; } .d7 { animation-delay: 3s; } .d8 { animation-delay: 3.5s; } .d9 { animation-delay: 4s; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 6% { transform: scale(1.8); } 12% { transform: scale(1); } }
    .runner { animation: run 9s linear infinite; }
    @keyframes run { from { transform: translateX(0); } to { transform: translateX(860px); } }
  </style>

  <rect width="1000" height="470" fill="url(#bg)"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="29" fill="#ece7fb">Un año de «no hace falta» y «sí hace falta»</text>
  <text x="40" y="74" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">Fuentes: CHANGELOG de Claude Code, blog de ingeniería de Anthropic y la charla en Y Combinator.</text>

  <text x="40" y="104" font-family="ui-monospace, monospace" font-size="12" fill="#fb7185">▲ se retira · «no hace falta»</text>
  <text x="40" y="452" font-family="ui-monospace, monospace" font-size="12" fill="#34d399">▼ vuelve · «sí hace falta»</text>

  <!-- eje -->
  <line class="flow" x1="70" y1="290" x2="945" y2="290" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>
  <circle class="runner" cx="70" cy="290" r="5" fill="#ece7fb" fill-opacity="0.8"/>
  <g font-family="ui-monospace, monospace" font-size="10" fill="#5a5375" text-anchor="middle">
    <line x1="70" y1="284" x2="70" y2="296" stroke="#5a5375"/><text x="70" y="310">oct 2025</text>
    <line x1="287" y1="284" x2="287" y2="296" stroke="#5a5375"/><text x="287" y="310">ene 2026</text>
    <line x1="499" y1="284" x2="499" y2="296" stroke="#5a5375"/><text x="499" y="310">abr</text>
    <line x1="713" y1="284" x2="713" y2="296" stroke="#5a5375"/><text x="700" y="310">jul</text>
  </g>

  <g font-family="ui-monospace, monospace" font-size="11">
    <!-- arriba: se retira -->
    <line x1="138" y1="144" x2="138" y2="284" stroke="#fb7185" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="146" y="128" fill="#8a7fb0">30 oct 2025</text>
    <text x="146" y="144" fill="#ece7fb">deprecan los estilos</text>
    <text x="146" y="158" fill="#ece7fb">de salida</text>
    <circle class="dot" cx="138" cy="290" r="6" fill="#0d0b16" stroke="#fb7185" stroke-width="2.5"/>

    <line x1="449" y1="144" x2="449" y2="284" stroke="#fb7185" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="457" y="128" fill="#8a7fb0">11 mar 2026</text>
    <text x="457" y="144" fill="#ece7fb">deprecan el comando</text>
    <text x="457" y="158" fill="#ece7fb">/output-style</text>
    <circle class="dot d3" cx="449" cy="290" r="6" fill="#0d0b16" stroke="#fb7185" stroke-width="2.5"/>

    <line x1="713" y1="130" x2="713" y2="284" stroke="#fb7185" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="721" y="114" fill="#8a7fb0">1 jul</text>
    <text x="721" y="130" fill="#ece7fb">retiran el asistente</text>
    <text x="721" y="144" fill="#ece7fb">/agents</text>
    <circle class="dot d6" cx="713" cy="290" r="6" fill="#0d0b16" stroke="#fb7185" stroke-width="2.5"/>

    <line x1="770" y1="186" x2="770" y2="284" stroke="#fb7185" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="778" y="170" fill="#8a7fb0">25 jul</text>
    <text x="778" y="186" fill="#ece7fb">«borramos el 80%</text>
    <text x="778" y="200" fill="#ece7fb">del system prompt»</text>
    <circle class="dot d7" cx="770" cy="290" r="6" fill="#0d0b16" stroke="#fb7185" stroke-width="2.5"/>

    <line x1="817" y1="242" x2="817" y2="284" stroke="#fb7185" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="825" y="226" fill="#8a7fb0">14 ago</text>
    <text x="825" y="242" fill="#ece7fb">sin listas de tareas</text>
    <text x="825" y="256" fill="#ece7fb">en modelos nuevos</text>
    <circle class="dot d8" cx="817" cy="290" r="6" fill="#0d0b16" stroke="#fb7185" stroke-width="2.5"/>

    <!-- abajo: vuelve -->
    <line x1="148" y1="296" x2="148" y2="340" stroke="#34d399" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="156" y="344" fill="#8a7fb0">3 nov 2025</text>
    <text x="156" y="360" fill="#ece7fb">vuelven, «por los</text>
    <text x="156" y="374" fill="#ece7fb">comentarios de la</text>
    <text x="156" y="388" fill="#ece7fb">comunidad»</text>
    <circle class="dot d2" cx="148" cy="290" r="6" fill="#0d0b16" stroke="#34d399" stroke-width="2.5"/>

    <line x1="480" y1="296" x2="480" y2="396" stroke="#34d399" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="488" y="400" fill="#8a7fb0">24 mar 2026</text>
    <text x="488" y="416" fill="#ece7fb">Anthropic: «el diseño</text>
    <text x="488" y="430" fill="#ece7fb">del harness es clave»</text>
    <circle class="dot d4" cx="480" cy="290" r="6" fill="#0d0b16" stroke="#34d399" stroke-width="2.5"/>

    <line x1="551" y1="296" x2="551" y2="340" stroke="#34d399" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="559" y="344" fill="#8a7fb0">23 abr</text>
    <text x="559" y="360" fill="#ece7fb">3 cambios del harness</text>
    <text x="559" y="374" fill="#ece7fb">empeoraron Claude Code</text>
    <circle class="dot d5" cx="551" cy="290" r="6" fill="#0d0b16" stroke="#34d399" stroke-width="2.5"/>

    <line x1="883" y1="296" x2="883" y2="340" stroke="#34d399" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="875" y="344" text-anchor="end" fill="#8a7fb0">11 sep</text>
    <text x="875" y="360" text-anchor="end" fill="#ece7fb">vuelve el comando</text>
    <text x="875" y="374" text-anchor="end" fill="#ece7fb">/output-style</text>
    <circle class="dot d9" cx="883" cy="290" r="6" fill="#0d0b16" stroke="#34d399" stroke-width="2.5"/>
  </g>
</svg>

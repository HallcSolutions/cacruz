<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-label="Asking for urgency all at once gave confidences from 0.48 to 0.54; decomposed into atomic red flags, each answer landed between 0.96 and 0.98 in the serious cases and below 0.04 for the minor injury">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
  </defs>
  <style>
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 6s ease-out infinite; }
    .b2 { animation-delay: .25s; } .b3 { animation-delay: .5s; } .b4 { animation-delay: .75s; }
    @keyframes grow { 0% { transform: scaleX(0); } 25%, 88% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .split { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  </style>

  <rect width="1000" height="480" fill="url(#bg)"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="29" fill="#ece7fb">One big question hesitates. Eight small ones do not.</text>
  <text x="40" y="74" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0">Measured in the triage project with jev-1.13: the same calls, two ways of asking.</text>

  <!-- Izquierda: pregunta compuesta -->
  <rect x="40" y="100" width="440" height="290" rx="12" fill="#14101f" stroke="#fb7185" stroke-opacity=".6"/>
  <text x="62" y="132" font-family="ui-monospace, monospace" font-size="15" fill="#fb7185">✗ "How urgent is it?"</text>
  <text x="62" y="154" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">one question weighing several factors · confidence</text>

  <text x="62" y="196" font-family="ui-monospace, monospace" font-size="13" fill="#ece7fb">Classic stroke</text>
  <rect x="200" y="184" width="220" height="16" rx="4" fill="#2a2342"/>
  <rect x="200" y="184" width="105.6" height="16" rx="4" fill="#fb7185" class="bar"/>
  <text x="430" y="197" font-family="ui-monospace, monospace" font-size="13" fill="#fb7185">0.48</text>

  <text x="62" y="236" font-family="ui-monospace, monospace" font-size="13" fill="#ece7fb">Major trauma</text>
  <rect x="200" y="224" width="220" height="16" rx="4" fill="#2a2342"/>
  <rect x="200" y="224" width="112.2" height="16" rx="4" fill="#fb7185" class="bar b2"/>
  <text x="430" y="237" font-family="ui-monospace, monospace" font-size="13" fill="#fb7185">0.51</text>

  <text x="62" y="276" font-family="ui-monospace, monospace" font-size="13" fill="#ece7fb">Minor injury</text>
  <rect x="200" y="264" width="220" height="16" rx="4" fill="#2a2342"/>
  <rect x="200" y="264" width="118.8" height="16" rx="4" fill="#fb7185" class="bar b3"/>
  <text x="430" y="277" font-family="ui-monospace, monospace" font-size="13" fill="#fb7185">0.54</text>

  <text x="62" y="330" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">Textbook cases, and still the answer</text>
  <text x="62" y="348" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">is spread out: the model sees no</text>
  <text x="62" y="366" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">clear winner among the levels.</text>

  <path d="M482 245 H518" stroke="#a78bfa" stroke-width="2" class="split"/>

  <!-- Derecha: banderas atómicas -->
  <rect x="520" y="100" width="440" height="290" rx="12" fill="#14101f" stroke="#34d399" stroke-opacity=".6"/>
  <text x="542" y="132" font-family="ui-monospace, monospace" font-size="15" fill="#34d399">✓ One red flag per question</text>
  <text x="542" y="154" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">one noul per sign · probability of "yes"</text>

  <text x="542" y="196" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">stroke_signs</text>
  <rect x="712" y="184" width="190" height="16" rx="4" fill="#2a2342"/>
  <rect x="712" y="184" width="186.2" height="16" rx="4" fill="#34d399" class="bar"/>
  <text x="910" y="197" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">0.98</text>

  <text x="542" y="236" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">cardiac_chest_pain</text>
  <rect x="712" y="224" width="190" height="16" rx="4" fill="#2a2342"/>
  <rect x="712" y="224" width="184.3" height="16" rx="4" fill="#34d399" class="bar b2"/>
  <text x="910" y="237" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">0.97</text>

  <text x="542" y="276" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">high_energy_trauma</text>
  <rect x="712" y="264" width="190" height="16" rx="4" fill="#2a2342"/>
  <rect x="712" y="264" width="182.4" height="16" rx="4" fill="#34d399" class="bar b3"/>
  <text x="910" y="277" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">0.96</text>

  <text x="542" y="316" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">minor injury: all</text>
  <rect x="712" y="304" width="190" height="16" rx="4" fill="#2a2342"/>
  <rect x="712" y="304" width="7.6" height="16" rx="4" fill="#a78bfa" class="bar b4"/>
  <text x="910" y="317" font-family="ui-monospace, monospace" font-size="13" fill="#a78bfa">≤0.04</text>

  <text x="542" y="356" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">Stroke, heart attack, major trauma: each sign</text>
  <text x="542" y="374" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">is answered clearly, in both directions.</text>

  <text x="40" y="428" font-family="ui-monospace, monospace" font-size="13" fill="#ece7fb" class="pulse">Priority is never asked: a protocol in code computes it from those flags.</text>
  <text x="40" y="454" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">Confidence and probability of "yes" are different scales; what they share is how clear the answer comes out.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-label="Flujo del triaje: la llamada entra, Jev responde nueve preguntas en paralelo, un protocolo en código calcula la prioridad, el despacho en código elige ambulancia y el hospital más cercano que sí tiene el servicio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <marker id="av" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/></marker>
  </defs>
  <style>
    .flow { stroke-dasharray: 8 8; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    .step { animation: step 7s ease-in-out infinite; }
    .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; } .s4 { animation-delay: 3s; } .s5 { animation-delay: 4s; }
    @keyframes step { 0%, 100% { stroke-opacity: .35; } 8%, 22% { stroke-opacity: 1; } 35% { stroke-opacity: .35; } }
    .dot { animation: dot 1.8s ease-in-out infinite; }
    .d2 { animation-delay: .2s; } .d3 { animation-delay: .4s; } .d4 { animation-delay: .6s; } .d5 { animation-delay: .8s; }
    .d6 { animation-delay: 1s; } .d7 { animation-delay: 1.2s; } .d8 { animation-delay: 1.4s; } .d9 { animation-delay: 1.6s; }
    @keyframes dot { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    .strike { stroke-dasharray: 200; stroke-dashoffset: 200; animation: strike 7s ease-in-out infinite; }
    @keyframes strike { 0%, 50% { stroke-dashoffset: 200; } 65%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 200; } }
    .win { animation: win 7s ease-in-out infinite; }
    @keyframes win { 0%, 60% { opacity: .2; } 72%, 92% { opacity: 1; } 100% { opacity: .2; } }
  </style>

  <rect width="1000" height="480" fill="url(#bg)"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="29" fill="#ece7fb">Jev responde. El código decide.</text>
  <text x="40" y="74" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0">Triaje y despacho de ambulancias en Cali: quién decide cada paso.</text>

  <!-- 1 Llamada -->
  <rect x="40" y="104" width="164" height="150" rx="10" fill="#1f1933" stroke="#a78bfa" class="step"/>
  <text x="56" y="132" font-family="ui-monospace, monospace" font-size="15" fill="#ece7fb">1 · Llamada</text>
  <text x="56" y="160" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">voz o texto</text>
  <text x="56" y="180" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">«boca torcida,</text>
  <text x="56" y="198" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">no habla bien»</text>
  <text x="56" y="238" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">la persona</text>
  <path d="M206 179 H225" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#av)"/>

  <!-- 2 Jev -->
  <rect x="229" y="104" width="164" height="150" rx="10" fill="#1f1933" stroke="#a78bfa" class="step s2"/>
  <text x="245" y="132" font-family="ui-monospace, monospace" font-size="15" fill="#ece7fb">2 · Jev</text>
  <text x="245" y="156" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">9 preguntas</text>
  <text x="245" y="174" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">en paralelo</text>
  <circle cx="251" cy="194" r="6" fill="#a78bfa" class="dot"/>
  <circle cx="267" cy="194" r="6" fill="#a78bfa" class="dot d2"/>
  <circle cx="283" cy="194" r="6" fill="#a78bfa" class="dot d3"/>
  <circle cx="299" cy="194" r="6" fill="#a78bfa" class="dot d4"/>
  <circle cx="315" cy="194" r="6" fill="#a78bfa" class="dot d5"/>
  <circle cx="331" cy="194" r="6" fill="#a78bfa" class="dot d6"/>
  <circle cx="347" cy="194" r="6" fill="#a78bfa" class="dot d7"/>
  <circle cx="363" cy="194" r="6" fill="#a78bfa" class="dot d8"/>
  <circle cx="379" cy="194" r="6" fill="#a78bfa" class="dot d9"/>
  <text x="245" y="238" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">Jev (IA)</text>
  <path d="M395 179 H414" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#av)"/>

  <!-- 3 Protocolo -->
  <rect x="418" y="104" width="164" height="150" rx="10" fill="#1f1933" stroke="#34d399" class="step s3"/>
  <text x="434" y="132" font-family="ui-monospace, monospace" font-size="15" fill="#ece7fb">3 · Protocolo</text>
  <text x="434" y="156" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">reglas R1…R8</text>
  <text x="434" y="174" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">gana la primera</text>
  <text x="434" y="198" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">R4_ACV → Crítica</text>
  <text x="434" y="238" font-family="ui-monospace, monospace" font-size="12" fill="#34d399">código</text>
  <path d="M584 179 H603" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#av)"/>

  <!-- 4 Despacho -->
  <rect x="607" y="104" width="164" height="150" rx="10" fill="#1f1933" stroke="#34d399" class="step s4"/>
  <text x="623" y="132" font-family="ui-monospace, monospace" font-size="15" fill="#ece7fb">4 · Despacho</text>
  <text x="623" y="156" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">ambulancia más</text>
  <text x="623" y="174" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">cercana</text>
  <text x="623" y="198" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">aritmética, &lt;1 ms</text>
  <text x="623" y="238" font-family="ui-monospace, monospace" font-size="12" fill="#34d399">código</text>
  <path d="M773 179 H792" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#av)"/>

  <!-- 5 Hospital -->
  <rect x="796" y="104" width="164" height="150" rx="10" fill="#1f1933" stroke="#34d399" class="step s5"/>
  <text x="812" y="132" font-family="ui-monospace, monospace" font-size="15" fill="#ece7fb">5 · Hospital</text>
  <text x="812" y="156" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">filtra por lo</text>
  <text x="812" y="174" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">que dijo Jev,</text>
  <text x="812" y="192" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">luego ordena</text>
  <text x="812" y="238" font-family="ui-monospace, monospace" font-size="12" fill="#34d399">código</text>

  <!-- Ejemplo -->
  <rect x="40" y="284" width="920" height="170" rx="12" fill="#14101f" stroke="#2a2342"/>
  <text x="62" y="316" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">Jev → required_capability: unidad_acv (confianza 1,00) · stroke_signs: 0,96 · 216 ms</text>

  <text x="62" y="356" font-family="ui-monospace, monospace" font-size="14" fill="#ece7fb">Hospital San Juan de Dios · 2,74 km</text>
  <text x="420" y="356" font-family="ui-monospace, monospace" font-size="13" fill="#fb7185">sin unidad de ACV → descartado</text>
  <line x1="58" y1="351" x2="352" y2="351" stroke="#fb7185" stroke-width="2" class="strike"/>

  <text x="62" y="392" font-family="ui-monospace, monospace" font-size="14" fill="#34d399" class="win">Hospital Universitario del Valle · 3,52 km</text>
  <text x="440" y="392" font-family="ui-monospace, monospace" font-size="13" fill="#34d399" class="win">✓ tiene unidad de ACV → despachado</text>

  <text x="62" y="432" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">9 de 12 hospitales descartados por no tener el servicio. El más cercano no era el correcto.</text>
</svg>

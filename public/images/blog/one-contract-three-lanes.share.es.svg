<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-label="Móvil, web y API en la misma feature: un contrato, tres carriles y dos agentes que no se pisan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#glow)"/>
  <rect x="64" y="72" width="4" height="250" fill="url(#rule)"/>

  <text x="96" y="92" font-family="Consolas, ui-monospace, monospace" font-size="17" letter-spacing="2.5" fill="#a78bfa">NOTAS DE DESARROLLO · CACRUZ.COM</text>

  <text x="96" y="168" font-family="Georgia, serif" font-size="54" fill="#ece7fb">Móvil, web y API en la misma feature:</text>
  <text x="96" y="232" font-family="Georgia, serif" font-size="54" fill="#a78bfa">un contrato, tres carriles</text>
  <text x="96" y="296" font-family="Georgia, serif" font-size="54" fill="#ece7fb">y dos agentes que no se pisan</text>

  <text x="96" y="352" font-family="Consolas, ui-monospace, monospace" font-size="19" fill="#8a7fb0">Flutter, Nest y Angular desde un solo contrato: quién reparte las reglas,</text>
  <text x="96" y="380" font-family="Consolas, ui-monospace, monospace" font-size="19" fill="#8a7fb0">quién orquesta de verdad y qué evita que integrar se lleve la semana.</text>

  <g>
    <rect x="64" y="424" width="340" height="118" rx="14" fill="#a78bfa" fill-opacity=".06" stroke="#3a3350" stroke-width="1.5"/>
    <text x="90" y="478" font-family="Georgia, serif" font-size="40" fill="#fb7185">1 → 3</text>
    <text x="90" y="506" font-family="Consolas, ui-monospace, monospace" font-size="14.5" fill="#8a7fb0">un contrato de API baja</text>
    <text x="90" y="526" font-family="Consolas, ui-monospace, monospace" font-size="14.5" fill="#8a7fb0">idéntico a los tres repos</text>

    <rect x="430" y="424" width="340" height="118" rx="14" fill="#a78bfa" fill-opacity=".06" stroke="#3a3350" stroke-width="1.5"/>
    <text x="456" y="478" font-family="Georgia, serif" font-size="40" fill="#fb7185">2</text>
    <text x="456" y="506" font-family="Consolas, ui-monospace, monospace" font-size="14.5" fill="#8a7fb0">agentes en paralelo: Claude Code</text>
    <text x="456" y="526" font-family="Consolas, ui-monospace, monospace" font-size="14.5" fill="#8a7fb0">y Codex, sin verse entre ellos</text>

    <rect x="796" y="424" width="340" height="118" rx="14" fill="#a78bfa" fill-opacity=".06" stroke="#3a3350" stroke-width="1.5"/>
    <text x="822" y="478" font-family="Georgia, serif" font-size="40" fill="#fb7185">≥80%</text>
    <text x="822" y="506" font-family="Consolas, ui-monospace, monospace" font-size="14.5" fill="#8a7fb0">de mutantes muertos: el mismo</text>
    <text x="822" y="526" font-family="Consolas, ui-monospace, monospace" font-size="14.5" fill="#8a7fb0">listón en los tres lenguajes</text>
  </g>

  <text x="64" y="588" font-family="Consolas, ui-monospace, monospace" font-size="16" fill="#5a5375">Christian Cruz Arango · cacruz.com/daily</text>
</svg>

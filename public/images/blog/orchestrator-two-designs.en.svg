<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="A comparison of two designs for chalc with the same shape. On the left, if chalc decided: the decisions would live inside the model output, an error at the centre would reach all three lanes at once, and testing it would require calling the model. On the right, chalc as it is, which only prepares: at the centre there is a contract, a fingerprinted file the person approves, a failure stays in whichever single lane it happens in, and its test runs with fake functions without spending tokens.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#fb7185"/>
    </marker>
    <marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#34d399"/>
    </marker>
    <marker id="aV" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <style>
    .think { animation: think 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .leak { stroke-dasharray: 5 6; animation: dashd 1.5s linear infinite; }
    .flow { stroke-dasharray: 6 8; animation: dashd 2s linear infinite; }
    .badbox { animation: badblink 3s ease-in-out infinite; }
    .b2 { animation-delay: .25s; } .b3 { animation-delay: .5s; }
    .ghostbar { animation: fade 3.4s ease-in-out infinite; }
    .okbar { animation: steady 5s ease-in-out infinite; }
    .wait { animation: fade 2.8s ease-in-out infinite; }
    @keyframes think { 0%, 100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.14); opacity: 1; } }
    @keyframes dashd { to { stroke-dashoffset: -44; } }
    @keyframes badblink { 0%, 100% { opacity: .5; } 45% { opacity: 1; } }
    @keyframes fade { 0%, 100% { opacity: .35; } 50% { opacity: .85; } }
    @keyframes steady { 0%, 100% { opacity: .82; } 50% { opacity: 1; } }
  </style>

  <rect width="1000" height="560" fill="url(#bg)"/>
  <text x="40" y="44" font-family="Georgia, serif" font-size="27" fill="#ece7fb">Why chalc doesn't decide for you</text>
  <text x="40" y="70" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">same shape in both · the only difference is what sits at the centre</text>

  <!-- ============ LEFT PANEL: decides ============ -->
  <rect x="34" y="88" width="452" height="396" rx="16" fill="none" stroke="#fb7185" stroke-width="2"/>
  <text x="54" y="118" font-family="ui-monospace, monospace" font-size="14" fill="#fb7185">if chalc DECIDED</text>

  <!-- thinking hub -->
  <g class="think"><circle cx="260" cy="156" r="19" fill="none" stroke="#fb7185" stroke-width="2"/></g>
  <text x="260" y="161" text-anchor="middle" font-size="15">🧠</text>
  <text x="298" y="160" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">would opine on all 3 lanes</text>

  <!-- bar: invisible decisions -->
  <g class="ghostbar">
    <rect x="96" y="190" width="328" height="26" rx="8" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="260" y="207" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fb7185">the decisions live IN HERE · nobody reads them</text>
  </g>

  <path d="M150 216 V 246" class="leak" stroke="#fb7185" stroke-width="2" fill="none" marker-end="url(#aR)"/>
  <path d="M260 216 V 246" class="leak" stroke="#fb7185" stroke-width="2" fill="none" marker-end="url(#aR)"/>
  <path d="M370 216 V 246" class="leak" stroke="#fb7185" stroke-width="2" fill="none" marker-end="url(#aR)"/>

  <g class="badbox"><rect x="52" y="252" width="124" height="34" rx="9" fill="none" stroke="#fb7185" stroke-width="1.5"/>
    <text x="114" y="273" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fb7185">back ✗</text></g>
  <g class="badbox b2"><rect x="198" y="252" width="124" height="34" rx="9" fill="none" stroke="#fb7185" stroke-width="1.5"/>
    <text x="260" y="273" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fb7185">web ✗</text></g>
  <g class="badbox b3"><rect x="344" y="252" width="124" height="34" rx="9" fill="none" stroke="#fb7185" stroke-width="1.5"/>
    <text x="406" y="273" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fb7185">mobile ✗</text></g>

  <text x="260" y="306" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">all three wrong, and in agreement: no contradiction to warn you</text>

  <line x1="54" y1="322" x2="466" y2="322" stroke="#2a2140" stroke-width="1"/>
  <text x="54" y="346" font-family="ui-monospace, monospace" font-size="10" fill="#fb7185">✗ its decisions cannot be asserted</text>
  <text x="68" y="362" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">at best you evaluate them: a score, not a guarantee</text>
  <text x="54" y="388" font-family="ui-monospace, monospace" font-size="10" fill="#fb7185">✗ to decide it must know everything</text>
  <text x="68" y="404" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">Dart, Angular and Nest packed into one head</text>
  <g class="wait">
    <text x="54" y="430" font-family="ui-monospace, monospace" font-size="10" fill="#fb7185">✗ it decides leaving no diff to approve</text>
    <text x="68" y="446" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">the decision lives in its output, not in a file</text>
  </g>
  <text x="54" y="470" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">and when it's wrong, there's nobody to ask why</text>

  <!-- ============ RIGHT PANEL: distributes ============ -->
  <rect x="514" y="88" width="452" height="396" rx="16" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="534" y="118" font-family="ui-monospace, monospace" font-size="14" fill="#34d399">if chalc only PREPARES</text>

  <!-- dumb hub -->
  <circle cx="740" cy="156" r="19" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="740" y="161" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#a78bfa">·</text>
  <text x="778" y="160" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">no opinions: generates and hands off</text>

  <!-- bar: the contract, a file -->
  <g class="okbar">
    <rect x="576" y="190" width="328" height="26" rx="8" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="740" y="207" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">contracts/api.md · a fingerprinted file YOU approve</text>
  </g>

  <path d="M630 216 V 246" class="flow" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#aG)"/>
  <path d="M740 216 V 246" class="flow" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#aG)"/>
  <path d="M850 216 V 246" class="flow" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#aG)"/>

  <rect x="532" y="252" width="124" height="34" rx="9" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <text x="594" y="273" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">back ✓</text>
  <g class="badbox"><rect x="678" y="252" width="124" height="34" rx="9" fill="none" stroke="#fb7185" stroke-width="1.5"/>
    <text x="740" y="273" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fb7185">any one of them ✗</text></g>
  <rect x="824" y="252" width="124" height="34" rx="9" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <text x="886" y="273" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">mobile ✓</text>

  <text x="740" y="306" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">if one fails — whichever — it fails alone: it surfaces in THAT repo's review</text>

  <line x1="534" y1="322" x2="946" y2="322" stroke="#2a2140" stroke-width="1"/>
  <text x="534" y="346" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">✓ its test runs with fake functions</text>
  <text x="548" y="362" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">0 tokens and the same result every time</text>
  <text x="534" y="388" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">✓ it knows no Dart and no Angular</text>
  <text x="548" y="404" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">it only knows who gets what</text>
  <text x="534" y="430" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">✓ distributing is instant</text>
  <text x="548" y="446" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">all three lanes move at once; nobody waits</text>
  <text x="534" y="470" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">and every decision has a date, a fingerprint and a person behind it</text>

  <!-- closing -->
  <line x1="34" y1="506" x2="966" y2="506" stroke="#2a2140" stroke-width="1"/>
  <text x="500" y="532" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#ece7fb">the decision doesn't disappear: it moves</text>
  <text x="500" y="550" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">from living inside a model's output, to being a diff somebody approves</text>
</svg>

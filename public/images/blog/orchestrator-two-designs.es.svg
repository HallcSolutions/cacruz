<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Comparación de dos diseños para chalc, con la misma forma. A la izquierda, si chalc decidiera: las decisiones vivirían dentro de la salida del modelo, un error en el centro bajaría a los tres carriles a la vez y probarlo exigiría llamar al modelo. A la derecha, chalc tal como es, que solo prepara: en el centro hay un contrato, un archivo con huella que la persona aprueba, un fallo se queda en un carril cualquiera y su test corre con funciones falsas sin gastar tokens.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#fb7185"/>
    </marker>
    <marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#34d399"/>
    </marker>
    <marker id="aV" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <style>
    .think { animation: think 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .leak { stroke-dasharray: 5 6; animation: dashd 1.5s linear infinite; }
    .flow { stroke-dasharray: 6 8; animation: dashd 2s linear infinite; }
    .badbox { animation: badblink 3s ease-in-out infinite; }
    .b2 { animation-delay: .25s; } .b3 { animation-delay: .5s; }
    .ghostbar { animation: fade 3.4s ease-in-out infinite; }
    .okbar { animation: steady 5s ease-in-out infinite; }
    .wait { animation: fade 2.8s ease-in-out infinite; }
    @keyframes think { 0%, 100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.14); opacity: 1; } }
    @keyframes dashd { to { stroke-dashoffset: -44; } }
    @keyframes badblink { 0%, 100% { opacity: .5; } 45% { opacity: 1; } }
    @keyframes fade { 0%, 100% { opacity: .35; } 50% { opacity: .85; } }
    @keyframes steady { 0%, 100% { opacity: .82; } 50% { opacity: 1; } }
  </style>

  <rect width="1000" height="560" fill="url(#bg)"/>
  <text x="40" y="44" font-family="Georgia, serif" font-size="27" fill="#ece7fb">Por qué chalc no decide por ti</text>
  <text x="40" y="70" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">la misma forma en los dos · lo único que cambia es qué hay en el centro</text>

  <!-- ============ PANEL IZQUIERDO: decide ============ -->
  <rect x="34" y="88" width="452" height="396" rx="16" fill="none" stroke="#fb7185" stroke-width="2"/>
  <text x="54" y="118" font-family="ui-monospace, monospace" font-size="14" fill="#fb7185">si chalc DECIDIERA</text>

  <!-- hub que piensa -->
  <g class="think"><circle cx="260" cy="156" r="19" fill="none" stroke="#fb7185" stroke-width="2"/></g>
  <text x="260" y="161" text-anchor="middle" font-size="15">🧠</text>
  <text x="298" y="160" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">opinaría sobre los 3 carriles</text>

  <!-- barra: decisiones invisibles -->
  <g class="ghostbar">
    <rect x="96" y="190" width="328" height="26" rx="8" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="260" y="207" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fb7185">las decisiones viven AQUÍ DENTRO · nadie las lee</text>
  </g>

  <path d="M150 216 V 246" class="leak" stroke="#fb7185" stroke-width="2" fill="none" marker-end="url(#aR)"/>
  <path d="M260 216 V 246" class="leak" stroke="#fb7185" stroke-width="2" fill="none" marker-end="url(#aR)"/>
  <path d="M370 216 V 246" class="leak" stroke="#fb7185" stroke-width="2" fill="none" marker-end="url(#aR)"/>

  <g class="badbox"><rect x="52" y="252" width="124" height="34" rx="9" fill="none" stroke="#fb7185" stroke-width="1.5"/>
    <text x="114" y="273" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fb7185">back ✗</text></g>
  <g class="badbox b2"><rect x="198" y="252" width="124" height="34" rx="9" fill="none" stroke="#fb7185" stroke-width="1.5"/>
    <text x="260" y="273" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fb7185">web ✗</text></g>
  <g class="badbox b3"><rect x="344" y="252" width="124" height="34" rx="9" fill="none" stroke="#fb7185" stroke-width="1.5"/>
    <text x="406" y="273" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fb7185">móvil ✗</text></g>

  <text x="260" y="306" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">los tres mal, y de acuerdo entre ellos: no hay contradicción que avise</text>

  <line x1="54" y1="322" x2="466" y2="322" stroke="#2a2140" stroke-width="1"/>
  <text x="54" y="346" font-family="ui-monospace, monospace" font-size="10" fill="#fb7185">✗ sus decisiones no se pueden asertar</text>
  <text x="68" y="362" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">como mucho se evalúan: una nota, no una garantía</text>
  <text x="54" y="388" font-family="ui-monospace, monospace" font-size="10" fill="#fb7185">✗ para decidir necesita saberlo todo</text>
  <text x="68" y="404" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">Dart, Angular y Nest en una sola cabeza</text>
  <g class="wait">
    <text x="54" y="430" font-family="ui-monospace, monospace" font-size="10" fill="#fb7185">✗ decide sin dejar un diff que aprobar</text>
    <text x="68" y="446" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">la decisión vive en su salida, no en un archivo</text>
  </g>
  <text x="54" y="470" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">y si se equivoca, no hay a quién preguntarle por qué</text>

  <!-- ============ PANEL DERECHO: reparte ============ -->
  <rect x="514" y="88" width="452" height="396" rx="16" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="534" y="118" font-family="ui-monospace, monospace" font-size="14" fill="#34d399">si chalc solo PREPARA</text>

  <!-- hub tonto -->
  <circle cx="740" cy="156" r="19" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="740" y="161" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#a78bfa">·</text>
  <text x="778" y="160" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">no opina: genera y entrega</text>

  <!-- barra: el contrato, un archivo -->
  <g class="okbar">
    <rect x="576" y="190" width="328" height="26" rx="8" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="740" y="207" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">contracts/api.md · un archivo con huella que TÚ apruebas</text>
  </g>

  <path d="M630 216 V 246" class="flow" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#aG)"/>
  <path d="M740 216 V 246" class="flow" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#aG)"/>
  <path d="M850 216 V 246" class="flow" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#aG)"/>

  <rect x="532" y="252" width="124" height="34" rx="9" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <text x="594" y="273" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">back ✓</text>
  <g class="badbox"><rect x="678" y="252" width="124" height="34" rx="9" fill="none" stroke="#fb7185" stroke-width="1.5"/>
    <text x="740" y="273" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fb7185">uno cualquiera ✗</text></g>
  <rect x="824" y="252" width="124" height="34" rx="9" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <text x="886" y="273" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">móvil ✓</text>

  <text x="740" y="306" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">si uno falla —da igual cuál— falla solo: sale en la revisión de ESE repo</text>

  <line x1="534" y1="322" x2="946" y2="322" stroke="#2a2140" stroke-width="1"/>
  <text x="534" y="346" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">✓ su test corre con funciones falsas</text>
  <text x="548" y="362" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">0 tokens y el mismo resultado siempre</text>
  <text x="534" y="388" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">✓ no sabe de Dart ni de Angular</text>
  <text x="548" y="404" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">solo sabe a quién le toca qué</text>
  <text x="534" y="430" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">✓ repartir es instantáneo</text>
  <text x="548" y="446" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">los tres carriles avanzan a la vez, nadie espera</text>
  <text x="534" y="470" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">y cada decisión tiene fecha, huella y una persona detrás</text>

  <!-- cierre -->
  <line x1="34" y1="506" x2="966" y2="506" stroke="#2a2140" stroke-width="1"/>
  <text x="500" y="532" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#ece7fb">la decisión no desaparece: cambia de sitio</text>
  <text x="500" y="550" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">de vivir dentro de la salida de un modelo, a ser un diff que alguien aprueba</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Un mismo requisito R2, escrito en notación EARS en el contrato, se prueba en los tres carriles. En NestJS es un test de endpoint con Stryker y el runner de jest. En Angular es un test de pantalla con Stryker y el runner de vitest. En Flutter es un test de widget con el paquete mutation_test. Los tres empiezan en rojo y los tres apuntan al mismo umbral: ochenta por ciento de mutantes muertos.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <style>
    .col { animation: pop 6.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .k2 { animation-delay: .5s; } .k3 { animation-delay: 1s; }
    .flow { stroke-dasharray: 6 8; animation: dash 1.9s linear infinite; }
    .flow-b { stroke-dasharray: 6 8; animation: dash 2.4s linear infinite; }
    .flow-c { stroke-dasharray: 6 8; animation: dash 2.9s linear infinite; }
    .red { animation: pulseR 3s ease-in-out infinite; }
    .green { animation: pulseG 3s ease-in-out infinite; animation-delay: 1.1s; }
    .bar { animation: fill 5s ease-in-out infinite; }
    @keyframes pop { 0%, 100% { opacity: .8; transform: translateY(0); } 10% { opacity: 1; transform: translateY(-4px); } 26% { opacity: .95; } }
    @keyframes dash { to { stroke-dashoffset: -56; } }
    @keyframes pulseR { 0%, 100% { opacity: .45; } 40% { opacity: 1; } }
    @keyframes pulseG { 0%, 100% { opacity: .45; } 40% { opacity: 1; } }
    @keyframes fill { 0% { width: 0; } 60%, 100% { width: 168px; } }
  </style>

  <rect width="1000" height="520" fill="url(#bg)"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="28" fill="#ece7fb">Un requisito, tres lenguajes, el mismo listón</text>
  <text x="40" y="72" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">el R# no se renumera por repo — cambia la herramienta, nunca el objetivo</text>

  <!-- requisito compartido -->
  <rect x="150" y="98" width="700" height="80" rx="14" fill="none" stroke="url(#ac)" stroke-width="2.5"/>
  <text x="170" y="124" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">specs/012-pedidos/contracts/api.md · idéntico en los tres repos</text>
  <text x="170" y="150" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">R2 — CUANDO el pedido ya fue cancelado EL SISTEMA DEBE responder 409</text>
  <text x="170" y="168" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">y no descontar inventario.</text>

  <path d="M185 178 V 218" class="flow" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M500 178 V 218" class="flow-b" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M815 178 V 218" class="flow-c" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- columna 1: NestJS -->
  <g class="col">
    <rect x="40" y="226" width="290" height="196" rx="14" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="60" y="254" font-family="ui-monospace, monospace" font-size="12" fill="#34d399">NestJS · test de endpoint</text>
    <text x="60" y="276" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">POST /orders/42/cancel dos veces</text>
    <text x="60" y="292" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">exige 409 · inventario intacto</text>
    <g class="red"><circle cx="68" cy="318" r="5" fill="#fb7185"/><text x="82" y="322" font-family="ui-monospace, monospace" font-size="9" fill="#fb7185">Red primero</text></g>
    <g class="green"><circle cx="178" cy="318" r="5" fill="#34d399"/><text x="192" y="322" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">Green mínimo</text></g>
    <line x1="60" y1="338" x2="310" y2="338" stroke="#2a2140" stroke-width="1"/>
    <text x="60" y="360" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">mutantes</text>
    <text x="60" y="378" font-family="ui-monospace, monospace" font-size="9" fill="#a78bfa">Stryker + jest-runner</text>
    <rect x="60" y="392" width="168" height="8" rx="4" fill="#2a2140"/>
    <rect class="bar" x="60" y="392" height="8" rx="4" fill="#34d399"/>
    <text x="240" y="400" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">≥ 80%</text>
  </g>

  <!-- columna 2: Angular -->
  <g class="col k2">
    <rect x="355" y="226" width="290" height="196" rx="14" fill="none" stroke="#453768" stroke-width="2"/>
    <text x="375" y="254" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">Angular · test de pantalla</text>
    <text x="375" y="276" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">simula el 409 del contrato</text>
    <text x="375" y="292" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">exige aviso · botón deshabilitado</text>
    <g class="red"><circle cx="383" cy="318" r="5" fill="#fb7185"/><text x="397" y="322" font-family="ui-monospace, monospace" font-size="9" fill="#fb7185">Red primero</text></g>
    <g class="green"><circle cx="493" cy="318" r="5" fill="#34d399"/><text x="507" y="322" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">Green mínimo</text></g>
    <line x1="375" y1="338" x2="625" y2="338" stroke="#2a2140" stroke-width="1"/>
    <text x="375" y="360" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">mutantes</text>
    <text x="375" y="378" font-family="ui-monospace, monospace" font-size="9" fill="#a78bfa">Stryker + vitest-runner</text>
    <rect x="375" y="392" width="168" height="8" rx="4" fill="#2a2140"/>
    <rect class="bar" x="375" y="392" height="8" rx="4" fill="#34d399"/>
    <text x="555" y="400" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">≥ 80%</text>
  </g>

  <!-- columna 3: Flutter -->
  <g class="col k3">
    <rect x="670" y="226" width="290" height="196" rx="14" fill="none" stroke="#453768" stroke-width="2"/>
    <text x="690" y="254" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">Flutter · test de widget</text>
    <text x="690" y="276" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">simula el mismo 409</text>
    <text x="690" y="292" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">exige aviso · sin doble envío</text>
    <g class="red"><circle cx="698" cy="318" r="5" fill="#fb7185"/><text x="712" y="322" font-family="ui-monospace, monospace" font-size="9" fill="#fb7185">Red primero</text></g>
    <g class="green"><circle cx="808" cy="318" r="5" fill="#34d399"/><text x="822" y="322" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">Green mínimo</text></g>
    <line x1="690" y1="338" x2="940" y2="338" stroke="#2a2140" stroke-width="1"/>
    <text x="690" y="360" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">mutantes</text>
    <text x="690" y="378" font-family="ui-monospace, monospace" font-size="9" fill="#a78bfa">mutation_test (pub.dev)</text>
    <rect x="690" y="392" width="168" height="8" rx="4" fill="#2a2140"/>
    <rect class="bar" x="690" y="392" height="8" rx="4" fill="#34d399"/>
    <text x="870" y="400" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">≥ 80%</text>
  </g>

  <!-- pie -->
  <line x1="40" y1="452" x2="960" y2="452" stroke="#2a2140" stroke-width="1"/>
  <text x="40" y="478" font-family="ui-monospace, monospace" font-size="11" fill="#ece7fb">si mañana R2 cambia, la búsqueda dura un segundo: grep R2 en los tres repos</text>
  <text x="40" y="500" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">contrato · spec · tareas · tests, en back, web y móvil — y ninguno lo descubre el día de integrar</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title description" xml:lang="es">
  <title id="title">La línea avanza cuando hay evidencia vigente</title>
  <desc id="description">La captura conserva la lección antes de la siguiente tarea</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#a78bfa"/></marker>
    <marker id="good" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#34d399"/></marker>
  </defs>
  <style>
    .stage { animation: reveal 8s ease-in-out infinite; }
    .flow { stroke-dasharray: 6 8; animation: dash 1.8s linear infinite; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    @keyframes reveal { 0%,100% { opacity:.72; } 12%,75% { opacity:1; } }
    @keyframes dash { to { stroke-dashoffset:-56; } }
    @keyframes pulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }
  </style>
  <rect width="1000" height="460" fill="url(#bg)"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="30" fill="#ece7fb" text-anchor="start">La línea avanza cuando hay evidencia vigente</text>
  <text x="40" y="82" font-family="ui-monospace, monospace" font-size="15" fill="#8a7fb0" text-anchor="start">La captura conserva la lección antes de la siguiente tarea</text>
  <g class="stage" style="animation-delay:0.0s"><rect x="30" y="132" width="172" height="128" rx="14" fill="#181329" fill-opacity=".5" stroke="#453768" stroke-width="1.5"/><text x="116" y="165" font-family="ui-monospace, monospace" font-size="17" fill="#ece7fb" text-anchor="middle">Spec</text><text x="116" y="202" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="middle">qué y por qué</text><text x="116" y="232" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0" text-anchor="middle">R1 · R2 · R3</text></g><path d="M204 193 H218" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><g class="stage" style="animation-delay:0.55s"><rect x="222" y="132" width="172" height="128" rx="14" fill="#181329" fill-opacity=".5" stroke="#453768" stroke-width="1.5"/><text x="308" y="165" font-family="ui-monospace, monospace" font-size="17" fill="#ece7fb" text-anchor="middle">Plan</text><text x="308" y="202" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="middle">cómo construir</text><text x="308" y="232" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0" text-anchor="middle">yo apruebo</text></g><path d="M396 193 H410" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><g class="stage" style="animation-delay:1.1s"><rect x="414" y="132" width="172" height="128" rx="14" fill="#181329" fill-opacity=".5" stroke="#453768" stroke-width="1.5"/><text x="500" y="165" font-family="ui-monospace, monospace" font-size="17" fill="#ece7fb" text-anchor="middle">Tareas + TDD</text><text x="500" y="202" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="middle">prueba antes</text><text x="500" y="232" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0" text-anchor="middle">rojo → verde</text></g><path d="M588 193 H602" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><g class="stage" style="animation-delay:1.6500000000000001s"><rect x="606" y="132" width="172" height="128" rx="14" fill="#a78bfa" fill-opacity=".05" stroke="#a78bfa" stroke-width="1.5"/><text x="692" y="165" font-family="ui-monospace, monospace" font-size="17" fill="#ece7fb" text-anchor="middle">Portón</text><text x="692" y="202" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="middle">ejecuta y mide</text><text x="692" y="232" font-family="ui-monospace, monospace" font-size="13" fill="#a78bfa" text-anchor="middle">informe vigente</text></g><path d="M780 193 H794" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><g class="stage" style="animation-delay:2.2s"><rect x="798" y="132" width="172" height="128" rx="14" fill="#181329" fill-opacity=".5" stroke="#453768" stroke-width="1.5"/><text x="884" y="165" font-family="ui-monospace, monospace" font-size="17" fill="#ece7fb" text-anchor="middle">Revisión</text><text x="884" y="202" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="middle">roles separados</text><text x="884" y="232" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0" text-anchor="middle">hallazgos → corregir</text></g><path d="M884 266 V294 H500 V332" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><rect x="400" y="338" width="548" height="72" rx="14" fill="#181329" fill-opacity=".5" stroke="#34d399" stroke-width="1.5"/><text x="674" y="369" font-family="ui-monospace, monospace" font-size="16" fill="#34d399" text-anchor="middle">Captura de memoria → siguiente tarea</text><text x="674" y="393" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="middle">Entrega: yo reviso y apruebo</text><rect x="30" y="338" width="325" height="72" rx="14" fill="#181329" fill-opacity=".5" stroke="#fb7185" stroke-width="1.5"/><text x="192" y="369" font-family="ui-monospace, monospace" font-size="14" fill="#fb7185" text-anchor="middle">Falla → corregir → medir otra vez</text><text x="192" y="393" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="middle">sin evidencia, no avanza</text><path d="M192 332 V294 H502 V266" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/>
</svg>

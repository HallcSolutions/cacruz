<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">I decide which lessons become rules</title>
  <desc id="description">The agent proposes and checks; I judge scope and usefulness</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#a78bfa"/></marker>
    <marker id="good" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#34d399"/></marker>
  </defs>
  <style>
    .stage { animation: reveal 8s ease-in-out infinite; }
    .flow { stroke-dasharray: 6 8; animation: dash 1.8s linear infinite; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    @keyframes reveal { 0%,100% { opacity:.72; } 12%,75% { opacity:1; } }
    @keyframes dash { to { stroke-dashoffset:-56; } }
    @keyframes pulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }
  </style>
  <rect width="1000" height="460" fill="url(#bg)"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="30" fill="#ece7fb" text-anchor="start">I decide which lessons become rules</text>
  <text x="40" y="82" font-family="ui-monospace, monospace" font-size="15" fill="#8a7fb0" text-anchor="start">The agent proposes and checks; I judge scope and usefulness</text>
  <g class="stage" style="animation-delay:0.0s"><rect x="40" y="124" width="445" height="208" rx="14" fill="#181329" fill-opacity=".5" stroke="#453768" stroke-width="1.5"/><text x="64" y="166" font-family="ui-monospace, monospace" font-size="21" fill="#ece7fb" text-anchor="start">Agents prepare</text></g><text x="64" y="214" font-family="ui-monospace, monospace" font-size="16" fill="#8a7fb0" text-anchor="start">Findings and proposed rules</text><text x="64" y="251" font-family="ui-monospace, monospace" font-size="16" fill="#8a7fb0" text-anchor="start">Tests + evidence + origin</text><text x="64" y="288" font-family="ui-monospace, monospace" font-size="16" fill="#8a7fb0" text-anchor="start">Use in the next task</text><g class="stage" style="animation-delay:0.8s"><rect x="515" y="124" width="445" height="208" rx="14" fill="#a78bfa" fill-opacity=".05" stroke="#a78bfa" stroke-width="1.5"/><text x="539" y="166" font-family="ui-monospace, monospace" font-size="21" fill="#a78bfa" text-anchor="start">I decide and approve</text></g><text x="539" y="214" font-family="ui-monospace, monospace" font-size="16" fill="#8a7fb0" text-anchor="start">Which lesson deserves a rule</text><text x="539" y="251" font-family="ui-monospace, monospace" font-size="16" fill="#8a7fb0" text-anchor="start">Rule scope and exceptions</text><text x="539" y="288" font-family="ui-monospace, monospace" font-size="16" fill="#8a7fb0" text-anchor="start">Validity and product acceptance</text><path d="M485 230 H509" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><text x="500" y="385" font-family="ui-monospace, monospace" font-size="20" fill="#a78bfa" text-anchor="middle">Accumulating lessons requires judgment</text><text x="500" y="419" font-family="ui-monospace, monospace" font-size="16" fill="#8a7fb0" text-anchor="middle">Capture preserves; I decide what should govern</text>
</svg>

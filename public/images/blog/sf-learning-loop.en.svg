<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">A written lesson changes the next loop</title>
  <desc id="description">Refunds: a finding returns as a rule and test</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#a78bfa"/></marker>
  </defs>
  <style>
    .stage { animation: reveal 8s ease-in-out infinite; }
    .flow { stroke-dasharray: 6 8; animation: dash 1.8s linear infinite; }
    @keyframes reveal { 0%,100% { opacity:.72; } 12%,75% { opacity:1; } }
    @keyframes dash { to { stroke-dashoffset:-56; } }
  </style>
  <rect width="1000" height="460" fill="url(#bg)"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="30" fill="#ece7fb" text-anchor="start">A written lesson changes the next loop</text>
  <text x="40" y="82" font-family="ui-monospace, monospace" font-size="15" fill="#8a7fb0" text-anchor="start">Refunds: a finding returns as a rule and test</text>
  <g class="stage" style="animation-delay:0s"><rect x="30" y="140" width="220" height="154" rx="14" fill="#181329" fill-opacity=".5" stroke="#453768" stroke-width="1.5"/><text x="46" y="173" font-family="ui-monospace, monospace" font-size="15" fill="#8a7fb0" text-anchor="start">Task</text><text x="46" y="219" font-family="ui-monospace, monospace" font-size="16" fill="#ece7fb" text-anchor="start">Partial refund</text><text x="46" y="266" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0" text-anchor="start">limit: remaining balance</text></g>
  <g class="stage" style="animation-delay:0.7s"><rect x="270" y="140" width="220" height="154" rx="14" fill="#181329" fill-opacity=".5" stroke="#fb7185" stroke-width="1.5"/><text x="286" y="173" font-family="ui-monospace, monospace" font-size="15" fill="#fb7185" text-anchor="start">Failure / finding</text><text x="286" y="219" font-family="ui-monospace, monospace" font-size="16" fill="#ece7fb" text-anchor="start">The mutant survives</text><text x="286" y="266" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0" text-anchor="start">suite misses the excess</text></g>
  <g class="stage" style="animation-delay:1.4s"><rect x="510" y="140" width="220" height="154" rx="14" fill="#181329" fill-opacity=".5" stroke="#a78bfa" stroke-width="1.5"/><text x="526" y="173" font-family="ui-monospace, monospace" font-size="15" fill="#a78bfa" text-anchor="start">Written lesson</text><text x="526" y="219" font-family="ui-monospace, monospace" font-size="16" fill="#ece7fb" text-anchor="start">Rule + test</text><text x="526" y="266" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0" text-anchor="start">review.md → memory.jsonl</text></g>
  <g class="stage" style="animation-delay:2.0999999999999996s"><rect x="750" y="140" width="220" height="154" rx="14" fill="#181329" fill-opacity=".5" stroke="#453768" stroke-width="1.5"/><text x="766" y="173" font-family="ui-monospace, monospace" font-size="15" fill="#8a7fb0" text-anchor="start">Next loop</text><text x="766" y="219" font-family="ui-monospace, monospace" font-size="16" fill="#ece7fb" text-anchor="start">Reads before acting</text><text x="766" y="266" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0" text-anchor="start">excess + exact balance</text></g><path d="M252 214 H264" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><path d="M492 214 H504" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><path d="M732 214 H744" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><path d="M860 302 V333 H140 V302" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><text x="500" y="375" font-family="ui-monospace, monospace" font-size="18" fill="#a78bfa" text-anchor="middle">The advisor retrieves by concept</text><text x="500" y="407" font-family="ui-monospace, monospace" font-size="15" fill="#8a7fb0" text-anchor="middle">The reviewer confirms the rule with evidence</text>
</svg>

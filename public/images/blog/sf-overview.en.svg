<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">The factory learns for the next loop</title>
  <desc id="description">Every delivery leaves experience another agent can check</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#a78bfa"/></marker>
  </defs>
  <style>
    .stage { animation: reveal 8s ease-in-out infinite; }
    .flow { stroke-dasharray: 6 8; animation: dash 1.8s linear infinite; }
    @keyframes reveal { 0%,100% { opacity:.72; } 12%,75% { opacity:1; } }
    @keyframes dash { to { stroke-dashoffset:-56; } }
  </style>
  <rect width="1000" height="460" fill="url(#bg)"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="30" fill="#ece7fb" text-anchor="start">The factory learns for the next loop</text>
  <text x="40" y="82" font-family="ui-monospace, monospace" font-size="15" fill="#8a7fb0" text-anchor="start">Every delivery leaves experience another agent can check</text>
  <g class="stage" style="animation-delay:0s"><rect x="40" y="124" width="290" height="176" rx="14" fill="#181329" fill-opacity=".5" stroke="#453768" stroke-width="1.5"/><text x="60" y="157" font-family="ui-monospace, monospace" font-size="15" fill="#8a7fb0" text-anchor="start">01 · Work</text><text x="60" y="198" font-family="ui-monospace, monospace" font-size="17" fill="#ece7fb" text-anchor="start">The agent builds</text><text x="60" y="237" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="start">spec + test + code</text><text x="60" y="274" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="start">reads earlier rules</text></g>
  <g class="stage" style="animation-delay:0.7s"><rect x="355" y="124" width="290" height="176" rx="14" fill="#181329" fill-opacity=".5" stroke="#453768" stroke-width="1.5"/><text x="375" y="157" font-family="ui-monospace, monospace" font-size="15" fill="#8a7fb0" text-anchor="start">02 · Evidence</text><text x="375" y="198" font-family="ui-monospace, monospace" font-size="17" fill="#ece7fb" text-anchor="start">The failure teaches</text><text x="375" y="237" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="start">mutation + review</text><text x="375" y="274" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="start">fixes and measures again</text></g>
  <g class="stage" style="animation-delay:1.4s"><rect x="670" y="124" width="290" height="176" rx="14" fill="#181329" fill-opacity=".5" stroke="#a78bfa" stroke-width="1.5"/><text x="690" y="157" font-family="ui-monospace, monospace" font-size="15" fill="#a78bfa" text-anchor="start">03 · Memory</text><text x="690" y="198" font-family="ui-monospace, monospace" font-size="17" fill="#ece7fb" text-anchor="start">The lesson is written</text><text x="690" y="237" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="start">rule + test + origin</text><text x="690" y="274" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="start">the next task receives it</text></g><path d="M332 212 H349" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><path d="M647 212 H664" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><path d="M815 307 V330 H185 V307" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><rect x="110" y="350" width="780" height="70" rx="14" fill="#181329" fill-opacity=".5" stroke="#a78bfa" stroke-width="1.5"/><text x="500" y="380" font-family="ui-monospace, monospace" font-size="18" fill="#a78bfa" text-anchor="middle">I decide what becomes a rule</text><text x="500" y="405" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="middle">Without learning between loops, it is just chat</text>
</svg>

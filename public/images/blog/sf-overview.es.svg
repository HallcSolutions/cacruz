<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title description" xml:lang="es">
  <title id="title">La fábrica aprende para la siguiente vuelta</title>
  <desc id="description">Cada entrega deja experiencia que otro agente puede comprobar</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#a78bfa"/></marker>
  </defs>
  <style>
    .stage { animation: reveal 8s ease-in-out infinite; }
    .flow { stroke-dasharray: 6 8; animation: dash 1.8s linear infinite; }
    @keyframes reveal { 0%,100% { opacity:.72; } 12%,75% { opacity:1; } }
    @keyframes dash { to { stroke-dashoffset:-56; } }
  </style>
  <rect width="1000" height="460" fill="url(#bg)"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="30" fill="#ece7fb" text-anchor="start">La fábrica aprende para la siguiente vuelta</text>
  <text x="40" y="82" font-family="ui-monospace, monospace" font-size="15" fill="#8a7fb0" text-anchor="start">Cada entrega deja experiencia que otro agente puede comprobar</text>
  <g class="stage" style="animation-delay:0s"><rect x="40" y="124" width="290" height="176" rx="14" fill="#181329" fill-opacity=".5" stroke="#453768" stroke-width="1.5"/><text x="60" y="157" font-family="ui-monospace, monospace" font-size="15" fill="#8a7fb0" text-anchor="start">01 · Trabajo</text><text x="60" y="198" font-family="ui-monospace, monospace" font-size="17" fill="#ece7fb" text-anchor="start">El agente construye</text><text x="60" y="237" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="start">spec + prueba + código</text><text x="60" y="274" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="start">lee las reglas anteriores</text></g>
  <g class="stage" style="animation-delay:0.7s"><rect x="355" y="124" width="290" height="176" rx="14" fill="#181329" fill-opacity=".5" stroke="#453768" stroke-width="1.5"/><text x="375" y="157" font-family="ui-monospace, monospace" font-size="15" fill="#8a7fb0" text-anchor="start">02 · Evidencia</text><text x="375" y="198" font-family="ui-monospace, monospace" font-size="17" fill="#ece7fb" text-anchor="start">El fallo enseña</text><text x="375" y="237" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="start">mutación + revisión</text><text x="375" y="274" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="start">corrige y vuelve a medir</text></g>
  <g class="stage" style="animation-delay:1.4s"><rect x="670" y="124" width="290" height="176" rx="14" fill="#181329" fill-opacity=".5" stroke="#a78bfa" stroke-width="1.5"/><text x="690" y="157" font-family="ui-monospace, monospace" font-size="15" fill="#a78bfa" text-anchor="start">03 · Memoria</text><text x="690" y="198" font-family="ui-monospace, monospace" font-size="17" fill="#ece7fb" text-anchor="start">La lección queda escrita</text><text x="690" y="237" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="start">regla + prueba + origen</text><text x="690" y="274" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="start">la siguiente tarea la recibe</text></g><path d="M332 212 H349" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><path d="M647 212 H664" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><path d="M815 307 V330 H185 V307" fill="none" stroke="#a78bfa" stroke-width="2" class="flow" marker-end="url(#arrow)"/><rect x="110" y="350" width="780" height="70" rx="14" fill="#181329" fill-opacity=".5" stroke="#a78bfa" stroke-width="1.5"/><text x="500" y="380" font-family="ui-monospace, monospace" font-size="18" fill="#a78bfa" text-anchor="middle">Yo decido qué se convierte en regla</text><text x="500" y="405" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0" text-anchor="middle">Sin aprendizaje entre vueltas, solo hay chat</text>
</svg>

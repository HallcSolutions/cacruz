<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="De la frase realízame este spec al commit: spec, plan y tareas, un bucle por tarea dirigido por el advisor, el endurecedor y el cierre">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <marker id="mv" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#34d399"/>
    </marker>
    <marker id="mr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#fb7185"/>
    </marker>
  </defs>
  <style>
    .box { animation: breathe 4s ease-in-out infinite; }
    .b2 { animation-delay: .5s } .b3 { animation-delay: 1s } .b4 { animation-delay: 1.5s } .b5 { animation-delay: 2s }
    .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
    .loop { stroke-dasharray: 6 8; animation: loop 2.4s linear infinite; }
    .core { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity:.82 } 50% { opacity:1 } }
    @keyframes flow { to { stroke-dashoffset: -56 } }
    @keyframes loop { to { stroke-dashoffset: -56 } }
    @keyframes pulse { 0%,100% { stroke-opacity:.55 } 50% { stroke-opacity:1 } }
  </style>

  <rect width="1000" height="520" fill="url(#bg)"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="27" fill="#ece7fb">De «realízame este spec» a «terminado»</text>
  <text x="40" y="72" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">primero los archivos, luego un bucle por tarea; el siguiente paso sale del disco</text>

  <!-- Fila 1: especificación -->
  <g font-family="ui-monospace, monospace">
    <g class="box">
      <rect x="40" y="100" width="200" height="64" rx="14" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
      <text x="56" y="124" font-size="11" fill="#a78bfa">TU FRASE</text>
      <text x="56" y="148" font-size="10" fill="#ece7fb">«realízame este spec»</text>
    </g>
    <g class="box b2">
      <rect x="280" y="100" width="200" height="64" rx="14" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text x="296" y="124" font-size="11" fill="#a78bfa">spec.md</text>
      <text x="296" y="148" font-size="10" fill="#ece7fb">QUÉ y PORQUÉ · R1 R2 R3</text>
    </g>
    <g class="box b3">
      <rect x="520" y="100" width="200" height="64" rx="14" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="536" y="124" font-size="11" fill="#a78bfa">plan.md</text>
      <text x="536" y="148" font-size="10" fill="#34d399">CÓMO · ✋ espera tu OK</text>
    </g>
    <g class="box b4">
      <rect x="760" y="100" width="200" height="64" rx="14" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text x="776" y="124" font-size="11" fill="#a78bfa">tasks.md</text>
      <text x="776" y="148" font-size="10" fill="#ece7fb">- [ ] una casilla por tarea</text>
    </g>
  </g>
  <line x1="244" y1="132" x2="274" y2="132" class="flow" stroke="#a78bfa" stroke-width="2" marker-end="url(#mv)"/>
  <line x1="484" y1="132" x2="514" y2="132" class="flow" stroke="#a78bfa" stroke-width="2" marker-end="url(#mv)"/>
  <line x1="724" y1="132" x2="754" y2="132" class="flow" stroke="#a78bfa" stroke-width="2" marker-end="url(#mv)"/>
  <path d="M860 168 L860 186 L122 186 L122 206" fill="none" class="flow" stroke="#a78bfa" stroke-width="2" marker-end="url(#mv)"/>
  <text x="500" y="205" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">POR CADA TAREA</text>

  <!-- Fila 2: el bucle de una tarea -->
  <g font-family="ui-monospace, monospace">
    <g class="box">
      <rect x="40" y="214" width="164" height="64" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text x="54" y="238" font-size="11" fill="#a78bfa">work_task</text>
      <text x="54" y="260" font-size="10" fill="#ece7fb">test rojo → verde</text>
    </g>
    <g class="box b2">
      <rect x="229" y="214" width="164" height="64" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text x="243" y="238" font-size="11" fill="#a78bfa">run_gate</text>
      <text x="243" y="260" font-size="10" fill="#ece7fb">tests + mutación ≥ 80%</text>
    </g>
    <g class="box b3">
      <rect x="418" y="214" width="164" height="64" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text x="432" y="238" font-size="11" fill="#a78bfa">call_role</text>
      <text x="432" y="260" font-size="10" fill="#ece7fb">seguridad · OWASP</text>
    </g>
    <g class="box b4">
      <rect x="607" y="214" width="164" height="64" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text x="621" y="238" font-size="11" fill="#a78bfa">call_role</text>
      <text x="621" y="260" font-size="10" fill="#ece7fb">revisor · calidad</text>
    </g>
    <g class="box b5">
      <rect x="796" y="214" width="164" height="64" rx="12" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="810" y="238" font-size="11" fill="#34d399">tick_task</text>
      <text x="810" y="260" font-size="10" fill="#ece7fb">casilla + memoria</text>
    </g>
  </g>
  <line x1="206" y1="246" x2="224" y2="246" class="flow" stroke="#a78bfa" stroke-width="2" marker-end="url(#mv)"/>
  <line x1="395" y1="246" x2="413" y2="246" class="flow" stroke="#a78bfa" stroke-width="2" marker-end="url(#mv)"/>
  <line x1="584" y1="246" x2="602" y2="246" class="flow" stroke="#a78bfa" stroke-width="2" marker-end="url(#mv)"/>
  <line x1="773" y1="246" x2="791" y2="246" class="flow" stroke="#34d399" stroke-width="2" marker-end="url(#mg)"/>
  <path d="M878 282 L878 302 L122 302 L122 286" fill="none" class="loop" stroke="#34d399" stroke-width="2" marker-end="url(#mg)"/>
  <text x="500" y="320" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">siguiente tarea, hasta que no quede ninguna</text>

  <!-- Fila 3: disco, advisor y salida de emergencia -->
  <g font-family="ui-monospace, monospace">
    <g class="box">
      <rect x="40" y="340" width="280" height="76" rx="14" fill="none" stroke="#8a7fb0" stroke-width="2"/>
      <text x="56" y="362" font-size="11" fill="#ece7fb">EL DISCO · .chalc/ y specs/</text>
      <text x="56" y="384" font-size="9" fill="#8a7fb0">gate.md · gate.state.json · task.json</text>
      <text x="56" y="400" font-size="9" fill="#8a7fb0">review.md · memory/ · tasks.md</text>
    </g>
    <rect x="350" y="340" width="300" height="76" rx="14" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-width="3" class="core"/>
    <text x="366" y="362" font-size="11" fill="#a78bfa">EL ADVISOR · node .chalc/next.mjs</text>
    <text x="366" y="384" font-size="10" fill="#ece7fb">lee el disco · responde UNA acción</text>
    <text x="366" y="400" font-size="9" fill="#fb7185">fix_gate · fix_review → vuelve a medir</text>
    <g class="box b3">
      <rect x="680" y="340" width="280" height="76" rx="14" fill="none" stroke="#fb7185" stroke-width="2"/>
      <text x="696" y="362" font-size="11" fill="#fb7185">ask_human</text>
      <text x="696" y="384" font-size="10" fill="#ece7fb">no puede leer el estado:</text>
      <text x="696" y="400" font-size="10" fill="#ece7fb">se para y te pregunta</text>
    </g>
  </g>
  <line x1="322" y1="378" x2="344" y2="378" class="flow" stroke="#8a7fb0" stroke-width="2" marker-end="url(#mv)"/>
  <line x1="652" y1="378" x2="674" y2="378" class="flow" stroke="#fb7185" stroke-width="2" marker-end="url(#mr)"/>

  <!-- Fila 4: cierre de la feature -->
  <g font-family="ui-monospace, monospace">
    <g class="box">
      <rect x="40" y="440" width="280" height="60" rx="14" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text x="56" y="463" font-size="11" fill="#a78bfa">call_role · endurecedor</text>
      <text x="56" y="485" font-size="10" fill="#ece7fb">casos borde de toda la feature</text>
    </g>
    <g class="box b2">
      <rect x="360" y="440" width="280" height="60" rx="14" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="376" y="463" font-size="11" fill="#34d399">done</text>
      <text x="376" y="485" font-size="10" fill="#ece7fb">casillas + evidencia + OK</text>
    </g>
    <g class="box b3">
      <rect x="680" y="440" width="280" height="60" rx="14" fill="none" stroke="#34d399" stroke-width="2.5"/>
      <text x="696" y="463" font-size="11" fill="#34d399">TU COMMIT</text>
      <text x="696" y="485" font-size="10" fill="#ece7fb">lees gate.md, revisas y firmas tú</text>
    </g>
  </g>
  <line x1="324" y1="470" x2="354" y2="470" class="flow" stroke="#34d399" stroke-width="2" marker-end="url(#mg)"/>
  <line x1="644" y1="470" x2="674" y2="470" class="flow" stroke="#34d399" stroke-width="2" marker-end="url(#mg)"/>
</svg>

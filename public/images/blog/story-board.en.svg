<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Three agents each point at a different entry of specs/active-story.json, which holds the open stories. On the right, specs/completed-stories.json keeps the closed ones with their surfaces and evidence. A story only moves from one file to the other once it is whole and verified.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
    .flow { stroke-dasharray: 6 8; animation: dash 2.1s linear infinite; }
    .flow-b { stroke-dasharray: 6 8; animation: dash 3.1s linear infinite; }
    .pulse { animation: glow 4.4s ease-in-out infinite; }
    .p2 { animation-delay: .7s; } .p3 { animation-delay: 1.4s; }
    .p4 { animation-delay: 2.1s; } .p5 { animation-delay: 2.8s; }
    @keyframes dash { to { stroke-dashoffset: -56; } }
    @keyframes glow { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }
  </style>
  <rect width="1000" height="560" fill="url(#bg)"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="28" fill="#ece7fb">The board: two files, one lane per agent</text>
  <text x="40" y="72" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">each agent bound to one entry; nobody reorders or rewrites anyone else</text>
  <rect class="pulse" x="40" y="158" width="178" height="52" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="56" y="180" font-family="ui-monospace, monospace" font-size="13" fill="#a78bfa">agent 1</text>
  <text x="56" y="197" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">one task · one story</text>
  <line class="flow" x1="218" y1="184" x2="254" y2="184" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="pulse p2" x="40" y="266" width="178" height="52" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="56" y="288" font-family="ui-monospace, monospace" font-size="13" fill="#a78bfa">agent 2</text>
  <text x="56" y="305" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">one task · one story</text>
  <line class="flow" x1="218" y1="292" x2="254" y2="292" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="pulse p3" x="40" y="374" width="178" height="52" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="56" y="396" font-family="ui-monospace, monospace" font-size="13" fill="#a78bfa">agent 3</text>
  <text x="56" y="413" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">one task · one story</text>
  <line class="flow" x1="218" y1="400" x2="254" y2="400" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="240" y="120" width="420" height="330" rx="14" fill="none" stroke="url(#ac)" stroke-width="2.5"/>
  <text x="258" y="146" font-family="ui-monospace, monospace" font-size="13" fill="#a78bfa">specs/active-story.json</text>
  <rect x="258" y="162" width="384" height="44" rx="9" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="274" y="181" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">012-persistent-cart</text>
  <text x="274" y="197" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">owner · coordination note</text>
  <rect x="258" y="216" width="384" height="44" rx="9" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="274" y="235" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">016-order-history</text>
  <text x="274" y="251" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">owner · coordination note</text>
  <rect x="258" y="270" width="384" height="44" rx="9" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="274" y="289" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">018-volume-discount</text>
  <text x="274" y="305" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">owner · coordination note</text>
  <rect x="258" y="324" width="384" height="44" rx="9" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="274" y="343" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">021-payment-gateway</text>
  <text x="274" y="359" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">owner · coordination note</text>
  <rect x="258" y="378" width="384" height="44" rx="9" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="274" y="397" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">022-shipping-notices</text>
  <text x="274" y="413" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">owner · coordination note</text>
  <rect x="700" y="120" width="260" height="330" rx="14" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="718" y="146" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">specs/</text>
  <text x="718" y="163" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">completed-stories.json</text>
  <text x="718" y="206" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">closed, with their evidence</text>
  <text x="718" y="236" font-family="ui-monospace, monospace" font-size="11" fill="#ece7fb">001-catalog-and-listings</text>
  <text x="718" y="260" font-family="ui-monospace, monospace" font-size="11" fill="#ece7fb">002-customer-accounts</text>
  <text x="718" y="284" font-family="ui-monospace, monospace" font-size="11" fill="#ece7fb">003-basic-cart</text>
  <text x="718" y="308" font-family="ui-monospace, monospace" font-size="11" fill="#ece7fb">004-contracts-and-data</text>
  <text x="718" y="356" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">…</text>
  <text x="718" y="396" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">surfaces: backend · web · mobile</text>
  <text x="718" y="412" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">evidence: tasks.md + evidence</text>
  <line class="flow-b" x1="450" y1="450" x2="450" y2="486" stroke="#34d399" stroke-width="1.6"/>
  <line class="flow-b" x1="450" y1="486" x2="826" y2="486" stroke="#34d399" stroke-width="1.6"/>
  <line class="flow-b" x1="826" y1="486" x2="826" y2="456" stroke="#34d399" stroke-width="1.6" marker-end="url(#arrowG)"/>
  <text x="638" y="478" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#34d399">only when closed whole and verified</text>
  <text x="40" y="522" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">always numeric order, from 001 upwards. Never by date: that way two agents insert at once without touching.</text>
</svg>

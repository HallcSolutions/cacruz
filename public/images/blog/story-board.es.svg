<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Tres agentes apuntan cada uno a una entrada distinta de specs/active-story.json, que lleva las historias abiertas. A la derecha, specs/completed-stories.json guarda las cerradas con sus superficies y su evidencia. Una historia solo pasa de un archivo al otro cuando está entera y verificada.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
    .flow { stroke-dasharray: 6 8; animation: dash 2.1s linear infinite; }
    .flow-b { stroke-dasharray: 6 8; animation: dash 3.1s linear infinite; }
    .pulse { animation: glow 4.4s ease-in-out infinite; }
    .p2 { animation-delay: .7s; } .p3 { animation-delay: 1.4s; }
    .p4 { animation-delay: 2.1s; } .p5 { animation-delay: 2.8s; }
    @keyframes dash { to { stroke-dashoffset: -56; } }
    @keyframes glow { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }
  </style>
  <rect width="1000" height="560" fill="url(#bg)"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="28" fill="#ece7fb">El tablero: dos archivos, un carril por agente</text>
  <text x="40" y="72" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">cada agente atado a una entrada; nadie reordena ni reescribe lo de los demás</text>
  <rect class="pulse" x="40" y="158" width="178" height="52" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="56" y="180" font-family="ui-monospace, monospace" font-size="13" fill="#a78bfa">agente 1</text>
  <text x="56" y="197" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">una tarea · una historia</text>
  <line class="flow" x1="218" y1="184" x2="254" y2="184" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="pulse p2" x="40" y="266" width="178" height="52" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="56" y="288" font-family="ui-monospace, monospace" font-size="13" fill="#a78bfa">agente 2</text>
  <text x="56" y="305" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">una tarea · una historia</text>
  <line class="flow" x1="218" y1="292" x2="254" y2="292" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="pulse p3" x="40" y="374" width="178" height="52" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="56" y="396" font-family="ui-monospace, monospace" font-size="13" fill="#a78bfa">agente 3</text>
  <text x="56" y="413" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">una tarea · una historia</text>
  <line class="flow" x1="218" y1="400" x2="254" y2="400" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="240" y="120" width="420" height="330" rx="14" fill="none" stroke="url(#ac)" stroke-width="2.5"/>
  <text x="258" y="146" font-family="ui-monospace, monospace" font-size="13" fill="#a78bfa">specs/active-story.json</text>
  <rect x="258" y="162" width="384" height="44" rx="9" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="274" y="181" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">012-carrito-persistente</text>
  <text x="274" y="197" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">owner · nota de coordinación</text>
  <rect x="258" y="216" width="384" height="44" rx="9" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="274" y="235" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">016-historial-de-pedidos</text>
  <text x="274" y="251" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">owner · nota de coordinación</text>
  <rect x="258" y="270" width="384" height="44" rx="9" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="274" y="289" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">018-descuento-por-volumen</text>
  <text x="274" y="305" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">owner · nota de coordinación</text>
  <rect x="258" y="324" width="384" height="44" rx="9" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="274" y="343" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">021-pasarela-de-pago</text>
  <text x="274" y="359" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">owner · nota de coordinación</text>
  <rect x="258" y="378" width="384" height="44" rx="9" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="274" y="397" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">022-avisos-de-envio</text>
  <text x="274" y="413" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">owner · nota de coordinación</text>
  <rect x="700" y="120" width="260" height="330" rx="14" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="718" y="146" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">specs/</text>
  <text x="718" y="163" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">completed-stories.json</text>
  <text x="718" y="206" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">cerradas, con su evidencia</text>
  <text x="718" y="236" font-family="ui-monospace, monospace" font-size="11" fill="#ece7fb">001-catalogo-y-fichas</text>
  <text x="718" y="260" font-family="ui-monospace, monospace" font-size="11" fill="#ece7fb">002-cuentas-de-cliente</text>
  <text x="718" y="284" font-family="ui-monospace, monospace" font-size="11" fill="#ece7fb">003-carrito-basico</text>
  <text x="718" y="308" font-family="ui-monospace, monospace" font-size="11" fill="#ece7fb">004-contratos-y-datos</text>
  <text x="718" y="356" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">…</text>
  <text x="718" y="396" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">surfaces: backend · web · móvil</text>
  <text x="718" y="412" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">evidence: tasks.md + evidencia</text>
  <line class="flow-b" x1="450" y1="450" x2="450" y2="486" stroke="#34d399" stroke-width="1.6"/>
  <line class="flow-b" x1="450" y1="486" x2="826" y2="486" stroke="#34d399" stroke-width="1.6"/>
  <line class="flow-b" x1="826" y1="486" x2="826" y2="456" stroke="#34d399" stroke-width="1.6" marker-end="url(#arrowG)"/>
  <text x="638" y="478" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#34d399">solo al cerrarla entera y verificada</text>
  <text x="40" y="522" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">orden numérico siempre, del 001 en adelante. Nunca por fecha: así dos agentes insertan a la vez sin tocarse.</text>
</svg>

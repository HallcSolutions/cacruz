<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Un único árbol de trabajo en la rama develop con 977 archivos tocados. Debajo, dos carpetas de estado independientes, una por historia de ejemplo, cada una con sus cinco archivos: task.json, task.files, gate.md, gate.state.json y review.md. La variable CHALC_STORY decide en cuál escribe cada agente.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
    .flow { stroke-dasharray: 6 8; animation: dash 2.1s linear infinite; }
    .flow-b { stroke-dasharray: 6 8; animation: dash 3.1s linear infinite; }
    .pulse { animation: glow 4.4s ease-in-out infinite; }
    .p2 { animation-delay: .7s; } .p3 { animation-delay: 1.4s; }
    .p4 { animation-delay: 2.1s; } .p5 { animation-delay: 2.8s; }
    @keyframes dash { to { stroke-dashoffset: -56; } }
    @keyframes glow { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }
  </style>
  <rect width="1000" height="520" fill="url(#bg)"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="28" fill="#ece7fb">Un árbol de trabajo, un estado por historia</text>
  <text x="40" y="72" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">la separación no está en el disco: está en qué carpeta guarda cada agente su medición</text>
  <rect x="40" y="96" width="920" height="54" rx="12" fill="none" stroke="#3a2f5c" stroke-width="1.5"/>
  <text x="60" y="128" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">un repositorio · rama develop · un árbol de trabajo · 977 archivos tocados</text>
  <text x="940" y="128" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" fill="#fb7185">sin worktrees · sin rama por agente</text>
  <rect class="pulse" x="40" y="200" width="440" height="234" rx="14" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="60" y="228" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">.chalc/stories/018-descuento-por-volumen/</text>
  <rect x="60" y="244" width="400" height="30" rx="8" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="76" y="264" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">task.json</text>
  <text x="444" y="264" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">desde qué punto se mide</text>
  <rect x="60" y="280" width="400" height="30" rx="8" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="76" y="300" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">task.files</text>
  <text x="444" y="300" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">qué archivos escribió la tarea</text>
  <rect x="60" y="316" width="400" height="30" rx="8" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="76" y="336" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">gate.md</text>
  <text x="444" y="336" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">la evidencia legible</text>
  <rect x="60" y="352" width="400" height="30" rx="8" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="76" y="372" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">gate.state.json</text>
  <text x="444" y="372" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">pass · fail · blocked</text>
  <rect x="60" y="388" width="400" height="30" rx="8" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="76" y="408" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">review.md</text>
  <text x="444" y="408" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">quién revisó y cuándo</text>
  <line class="flow" x1="260" y1="152" x2="260" y2="196" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="272" y="176" font-family="ui-monospace, monospace" font-size="11" fill="#a78bfa">CHALC_STORY=018…</text>
  <rect class="pulse p3" x="520" y="200" width="440" height="234" rx="14" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="540" y="228" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">.chalc/stories/022-avisos-de-envio/</text>
  <rect x="540" y="244" width="400" height="30" rx="8" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="556" y="264" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">task.json</text>
  <text x="924" y="264" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">desde qué punto se mide</text>
  <rect x="540" y="280" width="400" height="30" rx="8" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="556" y="300" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">task.files</text>
  <text x="924" y="300" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">qué archivos escribió la tarea</text>
  <rect x="540" y="316" width="400" height="30" rx="8" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="556" y="336" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">gate.md</text>
  <text x="924" y="336" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">la evidencia legible</text>
  <rect x="540" y="352" width="400" height="30" rx="8" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="556" y="372" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">gate.state.json</text>
  <text x="924" y="372" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">pass · fail · blocked</text>
  <rect x="540" y="388" width="400" height="30" rx="8" fill="none" stroke="#3a2f5c" stroke-width="1.2"/>
  <text x="556" y="408" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">review.md</text>
  <text x="924" y="408" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">quién revisó y cuándo</text>
  <line class="flow" x1="740" y1="152" x2="740" y2="196" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="752" y="176" font-family="ui-monospace, monospace" font-size="11" fill="#a78bfa">CHALC_STORY=022…</text>
  <text x="40" y="474" font-family="ui-monospace, monospace" font-size="12" fill="#8a7fb0">El portón exige CHALC_STORY y comprueba que esa historia esté en el tablero. Si no está, se niega a medir.</text>
</svg>

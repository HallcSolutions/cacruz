<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="From a user story with gaps to a testable spec">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/></linearGradient>
  </defs>
  <style>
    .pulse { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d1 { animation-delay: .4s; } .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.2s; } .d4 { animation-delay: 1.6s; }
    @keyframes pulse { 0%, 100% { opacity: .8; } 50% { opacity: 1; } }
    .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .blink { animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  </style>
  <rect width="1000" height="460" fill="url(#bg)"/>
  <text x="40" y="44" font-family="Georgia, serif" font-size="27" fill="#ece7fb">Why I turn every story into a spec</text>
  <text x="40" y="70" font-family="ui-monospace, monospace" font-size="13.5" fill="#8a7fb0">clarify decisions and questions before implementation</text>
  <rect x="40" y="100" width="380" height="320" rx="12" fill="#14101f" stroke="#fb7185" stroke-opacity=".6" stroke-width="2"/>
  <text x="60" y="130" font-family="ui-monospace, monospace" font-size="14" fill="#fb7185" text-anchor="start" font-weight="bold">USER STORY</text>
  <text x="60" y="162" font-family="ui-monospace, monospace" font-size="13" fill="#ece7fb" text-anchor="start" font-weight="normal">As a user</text>
  <text x="60" y="182" font-family="ui-monospace, monospace" font-size="13" fill="#ece7fb" text-anchor="start" font-weight="normal">I want to sign in</text>
  <text x="60" y="202" font-family="ui-monospace, monospace" font-size="13" fill="#ece7fb" text-anchor="start" font-weight="normal">to see my account</text>
  <g class="blink" style="animation-delay:0s"><text x="60" y="250" font-family="ui-monospace, monospace" font-size="12" fill="#fb7185" text-anchor="start" font-weight="normal">What if the password is empty?</text></g>
  <g class="blink" style="animation-delay:0.5s"><text x="60" y="284" font-family="ui-monospace, monospace" font-size="12" fill="#fb7185" text-anchor="start" font-weight="normal">How many failed attempts?</text></g>
  <g class="blink" style="animation-delay:1s"><text x="60" y="318" font-family="ui-monospace, monospace" font-size="12" fill="#fb7185" text-anchor="start" font-weight="normal">What if the account is locked?</text></g>
  <g class="blink" style="animation-delay:1.5s"><text x="60" y="352" font-family="ui-monospace, monospace" font-size="12" fill="#fb7185" text-anchor="start" font-weight="normal">Is “remember me” included?</text></g>
  <line class="flow" x1="430" y1="260" x2="548" y2="260" stroke="#a78bfa" stroke-width="3"/>
  <path d="M552 260 l-10 -6 v12 z" fill="#a78bfa"/>
  <text x="490" y="248" font-family="ui-monospace, monospace" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="normal">specify</text>
  <rect x="560" y="100" width="400" height="320" rx="12" fill="#14101f" stroke="#34d399" stroke-opacity=".7" stroke-width="2"/>
  <text x="580" y="130" font-family="ui-monospace, monospace" font-size="14" fill="#34d399" text-anchor="start" font-weight="bold">SPEC · AGREEMENT SUMMARY</text>
  <g class="pulse d1"><text x="580" y="164" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa" text-anchor="start" font-weight="bold">R1</text><text x="616" y="164" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb" text-anchor="start" font-weight="normal">valid access → dashboard</text></g>
  <g class="pulse d2"><text x="580" y="194" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa" text-anchor="start" font-weight="bold">R2</text><text x="616" y="194" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb" text-anchor="start" font-weight="normal">empty password → error</text></g>
  <g class="pulse d3"><text x="580" y="224" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa" text-anchor="start" font-weight="bold">R3</text><text x="616" y="224" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb" text-anchor="start" font-weight="normal">lockout → agreed policy</text></g>
  <g class="pulse d4"><text x="580" y="254" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa" text-anchor="start" font-weight="bold">R4</text><text x="616" y="254" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb" text-anchor="start" font-weight="normal">locked account → notice</text></g>
  <text x="580" y="330" font-family="ui-monospace, monospace" font-size="11.5" fill="#8a7fb0" text-anchor="start" font-weight="normal">Out of scope: “remember me”</text>
  <text x="580" y="352" font-family="ui-monospace, monospace" font-size="11.5" fill="#fbbf24" text-anchor="start" font-weight="normal">[NEEDS CLARIFICATION] IP-based lockout?</text>
  <text x="580" y="396" font-family="ui-monospace, monospace" font-size="12" fill="#34d399" text-anchor="start" font-weight="normal">✓ complete requirements → tests with IDs</text>
</svg>

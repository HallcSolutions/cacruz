<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-label="Los seis roles de swarm-forge frente al ciclo de chalc: dos andamiajes distintos con la misma idea">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <marker id="mv" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#a78bfa"/>
    </marker>
    <marker id="mg" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
    .chip { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
    .k2 { animation-delay: .4s } .k3 { animation-delay: .8s } .k4 { animation-delay: 1.2s }
    .k5 { animation-delay: 1.6s } .k6 { animation-delay: 2s }
    .flow { stroke-dasharray: 5 7; animation: flow 1.6s linear infinite; }
    .human { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity:.85 } 50% { opacity:1 } }
    @keyframes flow { to { stroke-dashoffset: -48 } }
    @keyframes pulse { 0%,100% { opacity:.6 } 50% { opacity:1 } }
  </style>

  <rect width="1000" height="580" fill="url(#bg)"/>
  <text x="40" y="48" font-family="Georgia, serif" font-size="27" fill="#ece7fb">Dos andamiajes distintos, la misma idea</text>
  <text x="40" y="74" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">nadie escribe código sin reglas, y nadie avanza sin verificar</text>

  <!-- Izquierda: swarm-forge -->
  <rect x="40" y="96" width="440" height="376" rx="16" fill="none" stroke="#3a3050" stroke-width="2"/>
  <text x="64" y="124" font-family="ui-monospace, monospace" font-size="13" fill="#a78bfa">SWARM-FORGE · seis agentes, un worktree cada uno</text>

  <g class="chip"><rect x="64" y="140" width="392" height="40" rx="10" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="82" y="165" font-family="ui-monospace, monospace" font-size="12" fill="#34d399">especificador · Gherkin + suite de QA</text></g>
  <line x1="260" y1="182" x2="260" y2="190" class="flow" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#mv)"/>

  <g class="chip k2"><rect x="64" y="192" width="392" height="40" rx="10" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text x="82" y="217" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">programador · implementa con TDD estricto</text></g>
  <line x1="260" y1="234" x2="260" y2="242" class="flow" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#mv)"/>

  <g class="chip k3"><rect x="64" y="244" width="392" height="40" rx="10" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text x="82" y="269" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">limpiador · limpieza y cobertura, CRAP y DRY</text></g>
  <line x1="260" y1="286" x2="260" y2="294" class="flow" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#mv)"/>

  <g class="chip k4"><rect x="64" y="296" width="392" height="40" rx="10" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text x="82" y="321" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">arquitecto · revisa la estructura</text></g>
  <line x1="260" y1="338" x2="260" y2="346" class="flow" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#mv)"/>

  <g class="chip k5"><rect x="64" y="348" width="392" height="40" rx="10" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text x="82" y="373" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">endurecedor · mutación del código y del Gherkin</text></g>
  <line x1="260" y1="390" x2="260" y2="398" class="flow" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#mv)"/>

  <g class="chip k6"><rect x="64" y="400" width="392" height="40" rx="10" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="82" y="425" font-family="ui-monospace, monospace" font-size="12" fill="#34d399">QA · convierte el QA en scripts y verifica</text></g>

  <text x="64" y="456" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">se pasan el trabajo por entregas validadas, no charlando entre ellos</text>

  <!-- Derecha: chalc -->
  <rect x="520" y="96" width="440" height="376" rx="16" fill="none" stroke="#3a3050" stroke-width="2"/>
  <text x="544" y="124" font-family="ui-monospace, monospace" font-size="13" fill="#a78bfa">CHALC · un agente que escribe, dos que comprueban</text>

  <g class="human"><rect x="544" y="140" width="392" height="40" rx="10" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="562" y="165" font-family="ui-monospace, monospace" font-size="12" fill="#34d399">spec en EARS · la apruebo yo antes del código</text></g>
  <line x1="740" y1="182" x2="740" y2="190" class="flow" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#mv)"/>

  <g class="chip k2"><rect x="544" y="192" width="392" height="40" rx="10" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text x="562" y="217" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">el agente implementa · una tarea, TDD estricto</text></g>
  <line x1="740" y1="234" x2="740" y2="242" class="flow" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#mv)"/>

  <g class="chip k3"><rect x="544" y="244" width="392" height="40" rx="10" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text x="562" y="269" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">el portón mide · tests, mutación, fronteras</text></g>
  <line x1="740" y1="286" x2="740" y2="294" class="flow" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#mv)"/>

  <g class="chip k4"><rect x="544" y="296" width="392" height="40" rx="10" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text x="562" y="321" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">el revisor lee · sin herramientas de escritura</text></g>
  <line x1="740" y1="338" x2="740" y2="346" class="flow" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#mv)"/>

  <g class="human"><rect x="544" y="348" width="392" height="40" rx="10" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="562" y="373" font-family="ui-monospace, monospace" font-size="12" fill="#34d399">mi OK · y solo entonces empieza la siguiente</text></g>

  <path d="M936 368 L960 368 L960 130 L936 130" class="flow" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#mg)"/>
  <text x="544" y="424" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">cada tarea vuelve a empezar el ciclo; la evidencia se pega tal cual</text>
  <text x="544" y="456" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">en verde, los dos puntos donde decide una persona y no un modelo</text>

  <!-- Cierre -->
  <rect x="40" y="486" width="920" height="66" rx="14" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="64" y="512" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">LO QUE COMPARTEN</text>
  <text x="64" y="536" font-family="ui-monospace, monospace" font-size="11" fill="#ece7fb">reglas que todos leen · un puesto por línea de trabajo · el que revisa no es el que escribió · nadie avanza sin verificar</text>
</svg>

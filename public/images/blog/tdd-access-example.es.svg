<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="visual-title visual-description"><title id="visual-title">TDD: prueba, implementación y refactorización</title><desc id="visual-description">La prueba del aviso de contraseña vacía comienza fallando. Se añade el código, la prueba pasa a verde y las piezas del código se reorganizan mientras la prueba sigue pasando.</desc><defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0d0b16" />
      <stop offset="1" stop-color="#181329" />
    </linearGradient>
    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#1c172b" />
      <stop offset="1" stop-color="#110e1b" />
    </linearGradient>
    <symbol id="person" viewBox="0 0 64 64">
      <circle cx="32" cy="20" r="11" />
      <path d="M12 57v-8c0-11 9-18 20-18s20 7 20 18v8" />
    </symbol>
    <symbol id="key" viewBox="0 0 64 64">
      <circle cx="21" cy="25" r="13" />
      <path d="m31 34 22 22m-8-8 8-8m-16 0 8-8" />
      <circle cx="17" cy="21" r="2" fill="currentColor" stroke="none" />
    </symbol>
    <symbol id="lock" viewBox="0 0 64 64">
      <path d="M19 28v-9a13 13 0 0 1 26 0v9" />
      <rect x="12" y="28" width="40" height="29" rx="8" />
      <path d="M32 39v8" />
    </symbol>
    <symbol id="check" viewBox="0 0 32 32">
      <path d="m7 16 6 6L26 9" />
    </symbol>
    <symbol id="cross" viewBox="0 0 32 32">
      <path d="m9 9 14 14m0-14L9 23" />
    </symbol>
    <symbol id="alert" viewBox="0 0 32 32">
      <path d="M16 5 29 27H3Z" stroke-linejoin="round" />
      <path d="M16 12v6m0 4v.2" />
    </symbol>
    <symbol id="arrow" viewBox="0 0 32 32">
      <path d="M5 16h22m-8-8 8 8-8 8" />
    </symbol>
    <symbol id="refactor" viewBox="0 0 40 40">
      <path d="M9 16a12 12 0 0 1 21-5l3 4m0-10v10H23M31 24a12 12 0 0 1-21 5l-3-4m0 10V25h10" />
    </symbol>
    <symbol id="robot" viewBox="0 0 100 120">
      <path d="M50 20V8m-8 0h16" />
      <rect x="17" y="22" width="66" height="47" rx="16" fill="#241c38" />
      <circle cx="36" cy="44" r="4" fill="#a78bfa" stroke="none" />
      <circle cx="64" cy="44" r="4" fill="#a78bfa" stroke="none" />
      <path d="M39 57h22M28 74v29m44-29v29M28 83l-13 9m57-9 13 9M37 104v11m26-11v11" />
      <rect x="29" y="73" width="42" height="31" rx="9" fill="#181329" />
      <path d="m46 83-6 6 6 6m8-12 6 6-6 6" />
    </symbol>
    <symbol id="mini-spec" viewBox="0 0 48 62">
      <path d="M5 2h27l11 11v47H5Z" fill="#211a34" />
      <path d="M31 2v12h12M13 22h21M13 30h21M13 38h12" />
      <circle cx="33" cy="47" r="9" fill="#12362e" stroke="#34d399" />
      <path d="m29 47 3 3 6-7" stroke="#34d399" />
    </symbol>
  </defs>
  <style>
    svg { --ease-out: cubic-bezier(.23,1,.32,1); --ease-in-out: cubic-bezier(.77,0,.175,1); }
    .card { fill: url(#panel); stroke: #3a3052; stroke-width: 1.5; }
    .label { fill: #ece7fb; font: 600 32px ui-monospace,monospace; letter-spacing: 2px; }
    .ink { fill: none; stroke: #c9bff0; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .muted { stroke: #66567f; }
    .violet { stroke: #a78bfa; }
    .green { stroke: #34d399; }
    .red { stroke: #fb7185; }
    .join { fill: none; stroke: #66567f; stroke-width: 2; stroke-linecap: round; }
    .tile { fill: #171222; stroke: #66567f; stroke-width: 1.8; }
    .node { fill: #211a34; stroke: #a78bfa; stroke-width: 2; }
    .dot { fill: #a78bfa; }
    .packet { animation: model-packet 12s var(--ease-in-out) infinite; }
    .rule-error { animation: rule-error 12s var(--ease-out) infinite; }
    .model-focus { animation: model-focus 12s var(--ease-out) infinite; }
    .cursor { animation: click-form 12s var(--ease-in-out) infinite; }
    .click-ring { transform-box: fill-box; transform-origin: center; animation: click-ring 12s var(--ease-out) infinite; }
    .form-error { animation: form-error 12s var(--ease-out) infinite; }
    .conversation { animation: conversation 12s var(--ease-out) infinite; }
    .spec-row-one { animation: row-one 12s var(--ease-out) infinite; }
    .spec-row-two { animation: row-two 12s var(--ease-out) infinite; }
    .spec-row-three { animation: row-three 12s var(--ease-out) infinite; }
    .approval { animation: approval 12s var(--ease-out) infinite; }
    .delivery { animation: delivery 12s var(--ease-in-out) infinite; }
    .agent-ready { animation: agent-ready 12s var(--ease-out) infinite; }
    .test-red { animation: test-red 12s var(--ease-out) infinite; }
    .test-green { animation: test-green 12s var(--ease-out) infinite; }
    .code-piece { animation: code-piece 12s var(--ease-out) infinite; }
    .code-piece-two { animation-delay: .2s; }
    .code-piece-three { animation-delay: .4s; }
    .tidy-first { animation: tidy-first 12s var(--ease-in-out) infinite; }
    .tidy-second { animation: tidy-second 12s var(--ease-in-out) infinite; }
    .tidy-third { animation: tidy-third 12s var(--ease-in-out) infinite; }
    .refactor-active { animation: refactor-active 12s var(--ease-out) infinite; }
    @keyframes model-packet {
      0%,8% { transform: translateX(0); opacity: 0; }
      13% { opacity: 1; }
      30%,39% { transform: translateX(53px); opacity: 1; }
      47%,100% { transform: translateX(53px); opacity: 0; }
    }
    @keyframes rule-error { 0%,28%,96%,100% { opacity: 0; } 35%,89% { opacity: 1; } }
    @keyframes model-focus { 0%,22%,96%,100% { opacity: .2; } 32%,89% { opacity: 1; } }
    @keyframes click-form {
      0%,10%,94%,100% { transform: translate(0,0); }
      30%,82% { transform: translate(-25px,-26px); }
    }
    @keyframes click-ring {
      0%,31% { opacity: 0; transform: scale(.95); }
      34% { opacity: .9; transform: scale(1); }
      43%,100% { opacity: 0; transform: scale(1.3); }
    }
    @keyframes form-error { 0%,34%,96%,100% { opacity: 0; } 41%,89% { opacity: 1; } }
    @keyframes conversation { 0%,4%,94%,100% { opacity: .3; } 12%,30% { opacity: 1; } 45%,85% { opacity: .5; } }
    @keyframes row-one { 0%,5%,98%,100% { opacity: .15; } 14%,92% { opacity: 1; } }
    @keyframes row-two { 0%,19%,98%,100% { opacity: .15; } 28%,92% { opacity: 1; } }
    @keyframes row-three { 0%,32%,98%,100% { opacity: .15; } 41%,92% { opacity: 1; } }
    @keyframes approval { 0%,44%,98%,100% { opacity: 0; } 51%,92% { opacity: 1; } }
    @keyframes delivery {
      0%,53% { opacity: 0; transform: translate(0,0); }
      58% { opacity: 1; transform: translate(0,0); }
      76% { opacity: 1; transform: translate(92px,-20px); }
      82%,100% { opacity: 0; transform: translate(108px,-20px); }
    }
    @keyframes agent-ready { 0%,75%,98%,100% { opacity: 0; } 81%,92% { opacity: 1; } }
    @keyframes test-red { 0%,33% { opacity: 1; } 43%,92% { opacity: 0; } 98%,100% { opacity: 1; } }
    @keyframes test-green { 0%,43%,98%,100% { opacity: 0; } 51%,92% { opacity: 1; } }
    @keyframes code-piece { 0%,20%,98%,100% { opacity: 0; transform: translateY(7px); } 32%,92% { opacity: 1; transform: translateY(0); } }
    @keyframes tidy-first { 0%,65%,100% { transform: translateX(0); } 76%,93% { transform: translateX(16px); } }
    @keyframes tidy-second { 0%,65%,100% { transform: translateX(0); } 76%,93% { transform: translateX(-12px); } }
    @keyframes tidy-third { 0%,65%,100% { transform: translateX(0); } 76%,93% { transform: translateX(8px); } }
    @keyframes refactor-active { 0%,65%,98%,100% { opacity: .18; } 76%,93% { opacity: 1; } }

.section-label { fill: #ece7fb; font: 600 78px ui-monospace,monospace; letter-spacing: 2px; }
</style>

  <rect width="1000" height="400" rx="22" fill="url(#background)" /><rect class="card" x="18" y="18" width="964" height="364" rx="22" /><text class="section-label" x="60" y="225">TDD</text><path d="M290 80v240" fill="none" stroke="#3a3052" stroke-width="1.5" /><g transform="translate(340 -56) scale(1.35)"><rect class="tile" x="26" y="106" width="169" height="132" rx="14" />
    <path class="join" d="M26 130h169" />
    <circle cx="42" cy="118" r="2.5" fill="#a78bfa" />
    <circle cx="52" cy="118" r="2.5" fill="#66567f" />
    <circle cx="62" cy="118" r="2.5" fill="#66567f" />
    <rect x="43" y="150" width="67" height="26" rx="5" fill="#110e1b" stroke="#8a7fb0" />
    <use href="#key" x="47" y="155" width="17" height="17" class="ink muted" />
    <use href="#arrow" x="114" y="152" width="22" height="22" class="ink muted" />
    <use href="#alert" x="143" y="151" width="23" height="23" class="ink red" />
    <g class="test-red">
      <rect x="26" y="106" width="169" height="132" rx="14" fill="none" stroke="#fb7185" stroke-width="2" />
      <use href="#cross" x="95" y="192" width="31" height="31" class="ink red" />
    </g>
    <g class="test-green">
      <rect x="26" y="106" width="169" height="132" rx="14" fill="none" stroke="#34d399" stroke-width="2" />
      <use href="#check" x="95" y="192" width="31" height="31" class="ink green" />
    </g>
    <use href="#arrow" x="203" y="156" width="31" height="31" class="ink muted" />
    <rect class="tile" x="244" y="89" width="189" height="149" rx="14" />
    <path class="join" d="M244 114h189" />
    <path class="ink violet" d="m260 99-5 3 5 3m8-6 5 3-5 3" />
    <g class="code-piece">
      <g class="tidy-first">
        <rect x="263" y="135" width="17" height="12" rx="3" fill="#a78bfa" />
        <rect x="286" y="135" width="82" height="12" rx="3" fill="#66567f" />
      </g>
    </g>
    <g class="code-piece code-piece-two">
      <g class="tidy-second">
        <rect x="303" y="160" width="17" height="12" rx="3" fill="#34d399" />
        <rect x="326" y="160" width="80" height="12" rx="3" fill="#66567f" />
      </g>
    </g>
    <g class="code-piece code-piece-three">
      <g class="tidy-third">
        <rect x="271" y="185" width="17" height="12" rx="3" fill="#a78bfa" />
        <rect x="294" y="185" width="82" height="12" rx="3" fill="#66567f" />
      </g>
    </g>
    <use href="#check" x="393" y="205" width="24" height="24" class="ink green test-green" />
    <path class="join" d="M107 288h112m30 0h111" />
    <use href="#arrow" x="158" y="276" width="24" height="24" class="ink muted" />
    <use href="#arrow" x="299" y="276" width="24" height="24" class="ink muted" />
    <circle cx="87" cy="288" r="22" fill="#32202c" stroke="#fb7185" stroke-width="1.5" />
    <use href="#cross" x="73" y="274" width="28" height="28" class="ink red" />
    <circle cx="234" cy="288" r="22" fill="#12362e" stroke="#34d399" stroke-width="1.5" />
    <use href="#check" x="220" y="274" width="28" height="28" class="ink green" />
    <circle cx="381" cy="288" r="22" fill="#211a34" stroke="#a78bfa" stroke-width="1.5" />
    <use href="#refactor" x="366" y="273" width="30" height="30" class="ink violet" />
    <circle cx="87" cy="288" r="28" fill="none" stroke="#fb7185" stroke-width="2" class="test-red" />
    <circle cx="234" cy="288" r="28" fill="none" stroke="#34d399" stroke-width="2" class="test-green" />
    <circle cx="381" cy="288" r="28" fill="none" stroke="#a78bfa" stroke-width="2" class="refactor-active" />
  </g></svg>

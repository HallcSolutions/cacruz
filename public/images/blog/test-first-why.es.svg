<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-label="El test escrito después describe el código; el test escrito antes lo juzga">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <marker id="dim" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5b4d80"/>
    </marker>
    <marker id="red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#fb7185"/>
    </marker>
    <marker id="grn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
    .flow { stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
    .slow { animation-duration: 2.4s; }
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 3s ease-in-out infinite; }
    .b2 { animation-delay: 1.2s; }
    .fade { animation: fade 3s ease-in-out infinite; }
    .f2 { animation-delay: 1.5s; }
    @keyframes dash { to { stroke-dashoffset: -56; } }
    @keyframes beat { 0%,100% { transform: scale(1); opacity:.9 } 50% { transform: scale(1.04); opacity:1 } }
    @keyframes fade { 0%,100% { opacity:.4 } 50% { opacity:1 } }
  </style>

  <rect width="1000" height="490" fill="url(#bg)"/>
  <text x="40" y="54" font-family="Georgia, serif" font-size="30" fill="#ece7fb">El mismo test, dos órdenes distintos</text>
  <text x="40" y="82" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0">de dónde sale el test decide si comprueba algo o solo lo describe</text>

  <!-- ============ CARRIL A · test después ============ -->
  <text x="40" y="140" font-family="ui-monospace, monospace" font-size="13" fill="#fb7185">test al final</text>
  <text x="40" y="160" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">lo habitual</text>

  <rect x="175" y="118" width="150" height="62" rx="12" fill="none" stroke="#332a52" stroke-width="2"/>
  <text x="250" y="145" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">requisito</text>
  <text x="250" y="165" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#5b4d80">R#</text>

  <line x1="333" y1="149" x2="382" y2="149" class="flow slow" stroke="#5b4d80" stroke-width="2" marker-end="url(#dim)"/>

  <rect x="390" y="118" width="150" height="62" rx="12" fill="none" stroke="#453768" stroke-width="2"/>
  <text x="465" y="145" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#ece7fb">código</text>
  <text x="465" y="165" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#5b4d80">lo escribe el agente</text>

  <line x1="548" y1="149" x2="597" y2="149" class="flow" stroke="#fb7185" stroke-width="2.5" marker-end="url(#red)"/>
  <text x="572" y="106" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#fb7185">lo copia</text>

  <rect x="605" y="118" width="150" height="62" rx="12" fill="none" stroke="#fb7185" stroke-width="2" class="beat"/>
  <text x="680" y="145" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#fb7185">test</text>
  <text x="680" y="165" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">nace en verde</text>

  <line x1="763" y1="149" x2="806" y2="149" stroke="#453768" stroke-width="2" marker-end="url(#dim)"/>

  <rect x="814" y="112" width="150" height="74" rx="12" fill="none" stroke="#fb7185" stroke-width="2"/>
  <text x="889" y="139" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#ece7fb">DESCRIBE</text>
  <text x="889" y="158" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">lo que el código</text>
  <text x="889" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">ya hacía</text>

  <text x="175" y="212" font-family="ui-monospace, monospace" font-size="11" fill="#fb7185" class="fade">✗ si el código entendió mal el requisito, el test firma el malentendido</text>

  <line x1="40" y1="248" x2="960" y2="248" stroke="#2a2140" stroke-width="1"/>

  <!-- ============ CARRIL B · test primero ============ -->
  <text x="40" y="330" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">test primero</text>
  <text x="40" y="350" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">como trabajo</text>

  <rect x="175" y="308" width="150" height="62" rx="12" fill="none" stroke="#332a52" stroke-width="2"/>
  <text x="250" y="335" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">requisito</text>
  <text x="250" y="355" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#5b4d80">R#</text>

  <line x1="333" y1="339" x2="382" y2="339" class="flow" stroke="#34d399" stroke-width="2.5" marker-end="url(#grn)"/>
  <text x="357" y="296" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">lo traduce</text>

  <rect x="390" y="308" width="150" height="62" rx="12" fill="none" stroke="#34d399" stroke-width="2" class="beat b2"/>
  <text x="465" y="335" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">test</text>
  <text x="465" y="355" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#fb7185">nace en rojo</text>

  <line x1="548" y1="339" x2="597" y2="339" class="flow slow" stroke="#a78bfa" stroke-width="2" marker-end="url(#dim)"/>
  <text x="572" y="296" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#a78bfa">lo exige</text>

  <rect x="605" y="308" width="150" height="62" rx="12" fill="none" stroke="#453768" stroke-width="2"/>
  <text x="680" y="335" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#ece7fb">código</text>
  <text x="680" y="355" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#5b4d80">lo escribe el agente</text>

  <line x1="763" y1="339" x2="806" y2="339" stroke="#453768" stroke-width="2" marker-end="url(#grn)"/>

  <rect x="814" y="302" width="150" height="74" rx="12" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="889" y="329" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#ece7fb">JUZGA</text>
  <text x="889" y="348" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">si el código cumple</text>
  <text x="889" y="362" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">lo prometido</text>

  <text x="175" y="402" font-family="ui-monospace, monospace" font-size="11" fill="#34d399" class="fade f2">✓ el agente no puede negociar con un test que existía antes que su código</text>

  <!-- Cierre -->
  <rect x="175" y="426" width="789" height="46" rx="12" fill="none" stroke="#453768" stroke-width="2"/>
  <text x="570" y="455" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">el orden no es estilo: decide si el test viene del requisito o del código</text>
</svg>

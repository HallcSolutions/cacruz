<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="La escalera de pruebas en Flutter y las pruebas de mutación">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <style>
    .rung { animation: step 6s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    .g2 { animation-delay: .45s; } .g3 { animation-delay: .9s; } .g4 { animation-delay: 1.35s; } .g5 { animation-delay: 1.8s; }
    .scan { animation: sweep 6s ease-in-out infinite; }
    .mut { animation: rg 3s ease-in-out infinite; }
    @keyframes step { 0%, 100% { opacity: .72; transform: translateX(0); } 10% { opacity: 1; transform: translateX(6px); } 26% { opacity: .9; } }
    @keyframes sweep { 0%, 100% { transform: translateY(0); opacity: .35; } 50% { transform: translateY(-208px); opacity: .9; } }
    @keyframes rg { 0%, 45% { fill: #fb7185; } 55%, 100% { fill: #34d399; } }
  </style>

  <rect width="1000" height="460" fill="url(#bg)"/>
  <text x="40" y="50" font-family="Georgia, serif" font-size="29" fill="#ece7fb">Cinco peldaños y una pregunta sobre todos ellos</text>
  <text x="40" y="78" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0">cada nivel responde algo distinto · los mutantes preguntan si el nivel sirve</text>

  <!-- eje -->
  <line x1="72" y1="118" x2="72" y2="392" stroke="#453768" stroke-width="2"/>
  <text x="88" y="108" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">↑ más caro · más real</text>
  <text x="88" y="402" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">↓ más rápido · más veces</text>

  <!-- peldaños, de abajo (rápido) a arriba (caro) -->
  <g class="rung"><rect x="88" y="336" width="600" height="46" rx="10" fill="none" stroke="#453768" stroke-width="1.8"/>
    <text x="110" y="358" font-family="ui-monospace, monospace" font-size="13.5" fill="#a78bfa">unitarias · dominio en Dart puro</text>
    <text x="110" y="374" font-family="ui-monospace, monospace" font-size="11.5" fill="#8a7fb0">¿la regla de negocio es correcta?</text></g>
  <g class="rung g2"><rect x="88" y="282" width="600" height="46" rx="10" fill="none" stroke="#453768" stroke-width="1.8"/>
    <text x="110" y="304" font-family="ui-monospace, monospace" font-size="13.5" fill="#a78bfa">de widget · testWidgets</text>
    <text x="110" y="320" font-family="ui-monospace, monospace" font-size="11.5" fill="#8a7fb0">¿el usuario ve y puede pulsar lo que debe?</text></g>
  <g class="rung g3"><rect x="88" y="228" width="600" height="46" rx="10" fill="none" stroke="#453768" stroke-width="1.8"/>
    <text x="110" y="250" font-family="ui-monospace, monospace" font-size="13.5" fill="#a78bfa">golden · imagen aprobada</text>
    <text x="110" y="266" font-family="ui-monospace, monospace" font-size="11.5" fill="#8a7fb0">¿la pantalla sigue viéndose igual a 390 px?</text></g>
  <g class="rung g4"><rect x="88" y="174" width="600" height="46" rx="10" fill="none" stroke="#453768" stroke-width="1.8"/>
    <text x="110" y="196" font-family="ui-monospace, monospace" font-size="13.5" fill="#a78bfa">accesibilidad e idioma</text>
    <text x="110" y="212" font-family="ui-monospace, monospace" font-size="11.5" fill="#8a7fb0">¿se puede usar y sigue cabiendo al traducir?</text></g>
  <g class="rung g5"><rect x="88" y="120" width="600" height="46" rx="10" fill="none" stroke="url(#ac)" stroke-width="2.2"/>
    <text x="110" y="142" font-family="ui-monospace, monospace" font-size="13.5" fill="#ece7fb">integración · la app real en un dispositivo</text>
    <text x="110" y="158" font-family="ui-monospace, monospace" font-size="11.5" fill="#8a7fb0">¿arranca, pide permisos y el flujo entero funciona?</text></g>

  <!-- los mutantes preguntan sobre los peldaños -->
  <rect x="716" y="120" width="244" height="262" rx="14" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="838" y="152" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">PRUEBAS DE MUTACIÓN</text>
  <g class="scan"><rect x="88" y="336" width="600" height="46" rx="10" fill="#a78bfa" opacity=".14"/></g>
  <text x="838" y="196" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">rompo el código a propósito</text>
  <text x="838" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">y vuelvo a correr la suite</text>
  <circle class="mut" cx="838" cy="258" r="13"/>
  <text x="838" y="290" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">si sigue en verde,</text>
  <text x="838" y="306" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">ese test no probaba nada</text>
  <text x="838" y="338" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#34d399">umbral: matar el 80%</text>

  <text x="88" y="436" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">Un test verde no prueba que la app arranque; por eso la escalera no termina en las unitarias.</text>
</svg>

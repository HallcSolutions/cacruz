<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-label="Tres técnicas, tres blancos: el test ataca al código, el mutante a los tests, el adversario a la implementación">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#34d399"/>
    </marker>
    <marker id="mv" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="mr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#fb7185"/>
    </marker>
  </defs>
  <style>
    .flow { stroke-dasharray: 5 7; animation: dash 1.4s linear infinite; }
    .d2 { animation-delay: .45s; } .d3 { animation-delay: .9s; }
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 3.2s ease-in-out infinite; }
    .k2 { animation-delay: 1.05s; } .k3 { animation-delay: 2.1s; }
    .fade { animation: fade 3.2s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -48; } }
    @keyframes beat { 0%,100% { transform: scale(1); opacity:.85 } 50% { transform: scale(1.05); opacity:1 } }
    @keyframes fade { 0%,100% { opacity:.45 } 50% { opacity:1 } }
  </style>

  <rect width="1000" height="480" fill="url(#bg)"/>
  <text x="40" y="54" font-family="Georgia, serif" font-size="30" fill="#ece7fb">Tres técnicas, tres blancos, tres preguntas</text>
  <text x="40" y="82" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0">no compiten: cada una tapa un agujero que las otras dos dejan abierto</text>

  <!-- ===== 1 · TDD ===== -->
  <rect x="40" y="108" width="290" height="278" rx="16" fill="none" stroke="#26203c" stroke-width="2"/>
  <rect x="65" y="132" width="240" height="42" rx="10" fill="none" stroke="#34d399" stroke-width="2" class="beat"/>
  <text x="185" y="158" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#34d399">el TDD · el test primero</text>
  <line x1="185" y1="182" x2="185" y2="212" class="flow" stroke="#34d399" stroke-width="2" marker-end="url(#mg)"/>
  <text x="200" y="202" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">ataca a</text>
  <rect x="65" y="220" width="240" height="48" rx="10" fill="none" stroke="#453768" stroke-width="2"/>
  <text x="185" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#ece7fb">EL CÓDIGO</text>
  <text x="185" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#34d399">«¿hace lo que prometí?»</text>
  <text x="185" y="336" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">sale del requisito · es finito</text>
  <text x="185" y="354" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">sabe cuándo ha terminado</text>

  <!-- ===== 2 · Mutación ===== -->
  <rect x="355" y="108" width="290" height="278" rx="16" fill="none" stroke="#26203c" stroke-width="2"/>
  <rect x="380" y="132" width="240" height="42" rx="10" fill="none" stroke="#a78bfa" stroke-width="2" class="beat k2"/>
  <text x="500" y="158" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">el mutante</text>
  <line x1="500" y1="182" x2="500" y2="212" class="flow d2" stroke="#a78bfa" stroke-width="2" marker-end="url(#mv)"/>
  <text x="515" y="202" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">ataca a</text>
  <rect x="380" y="220" width="240" height="48" rx="10" fill="none" stroke="#453768" stroke-width="2"/>
  <text x="500" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#ece7fb">LOS TESTS</text>
  <text x="500" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#a78bfa">«¿me enteraría si fallara?»</text>
  <text x="500" y="336" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">no busca fallos en el programa:</text>
  <text x="500" y="354" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">busca huecos en mi vigilancia</text>

  <!-- ===== 3 · Adversarial ===== -->
  <rect x="670" y="108" width="290" height="278" rx="16" fill="none" stroke="#26203c" stroke-width="2"/>
  <rect x="695" y="132" width="240" height="42" rx="10" fill="none" stroke="#fb7185" stroke-width="2" class="beat k3"/>
  <text x="815" y="158" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#fb7185">el adversario</text>
  <line x1="815" y1="182" x2="815" y2="212" class="flow d3" stroke="#fb7185" stroke-width="2" marker-end="url(#mr)"/>
  <text x="830" y="202" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">ataca a</text>
  <rect x="695" y="220" width="240" height="48" rx="10" fill="none" stroke="#453768" stroke-width="2"/>
  <text x="815" y="244" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">LA IMPLEMENTACIÓN</text>
  <text x="815" y="260" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#8a7fb0">tal como quedó</text>
  <text x="815" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#fb7185">«¿qué no se me ocurrió?»</text>
  <text x="815" y="336" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">sin lista que agotar: paras por</text>
  <text x="815" y="354" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">presupuesto, no porque acabaste</text>

  <!-- Cierre -->
  <rect x="40" y="412" width="920" height="48" rx="12" fill="none" stroke="#453768" stroke-width="2"/>
  <text x="500" y="442" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa" class="fade">sin oráculo, el adversario solo sabe reconocer una cosa: que el programa se cayó</text>
</svg>

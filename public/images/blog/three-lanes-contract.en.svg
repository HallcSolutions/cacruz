<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="A user story enters chalc, which generates a single API contract. Three lanes come out of the contract: a NestJS backend that owns it, an Angular web app and a Flutter mobile app, both consumers. At the bottom, the backend answering each consumer privately on its own, with cross-screen consistency left ownerless, is compared against one contract all three read the same way.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
    .step { animation: pop 6.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .s2 { animation-delay: .45s; } .s3 { animation-delay: .9s; }
    .s4 { animation-delay: 1.5s; } .s5 { animation-delay: 2s; } .s6 { animation-delay: 2.5s; }
    .flow { stroke-dasharray: 6 8; animation: dash 1.7s linear infinite; }
    .flow-b { stroke-dasharray: 6 8; animation: dash 2.3s linear infinite; }
    .flow-c { stroke-dasharray: 6 8; animation: dash 2.9s linear infinite; }
    .hub { animation: spin 15s linear infinite; transform-box: fill-box; transform-origin: center; }
    .tangle { animation: blink 4.5s ease-in-out infinite; }
    @keyframes pop { 0%, 100% { opacity: .78; transform: translateY(0); } 8% { opacity: 1; transform: translateY(-4px); } 22% { opacity: .95; } }
    @keyframes dash { to { stroke-dashoffset: -56; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 0%, 100% { opacity: .45; } 50% { opacity: .95; } }
  </style>

  <rect width="1000" height="540" fill="url(#bg)"/>
  <text x="40" y="48" font-family="Georgia, serif" font-size="29" fill="#ece7fb">One contract, three lanes</text>
  <text x="40" y="74" font-family="ui-monospace, monospace" font-size="13" fill="#8a7fb0">the contract doesn't know how many consume it — that's why it survives the third</text>

  <!-- 1. Story -->
  <g class="step">
    <rect x="36" y="168" width="124" height="98" rx="14" fill="none" stroke="#453768" stroke-width="2"/>
    <text x="98" y="204" text-anchor="middle" font-size="24">📄</text>
    <text x="98" y="230" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">1 story</text>
    <text x="98" y="249" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">Jira · Azure · pasted</text>
  </g>
  <line x1="166" y1="217" x2="204" y2="217" class="flow" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. chalc -->
  <g class="step s2">
    <rect x="210" y="156" width="150" height="122" rx="14" fill="none" stroke="url(#ac)" stroke-width="2.5"/>
    <g class="hub">
      <circle cx="285" cy="192" r="14" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 6"/>
      <circle cx="285" cy="178" r="3" fill="#a78bfa"/>
    </g>
    <text x="285" y="228" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">chalc feature</text>
    <text x="285" y="248" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">doesn't code: it prepares</text>
    <text x="285" y="264" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">equips · generates · seals</text>
  </g>
  <line x1="366" y1="217" x2="404" y2="217" class="flow" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Contract -->
  <g class="step s3">
    <rect x="410" y="150" width="170" height="134" rx="14" fill="none" stroke="url(#ac)" stroke-width="2.5"/>
    <text x="495" y="176" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">specs/012-orders/</text>
    <text x="495" y="196" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">contracts/api.md</text>
    <text x="495" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#ece7fb">R1 · R2 · R3…</text>
    <text x="495" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">endpoints · models · auth</text>
    <text x="495" y="258" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">the same copy in all 3 repos</text>
    <text x="495" y="276" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">fingerprint stamped in</text>
  </g>

  <!-- distribution bus -->
  <path d="M580 217 H 616" class="flow" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <path d="M616 132 V 356" stroke="#453768" stroke-width="2" fill="none"/>
  <path d="M616 132 H 650" class="flow" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrowG)"/>
  <path d="M616 244 H 650" class="flow-b" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M616 356 H 650" class="flow-c" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="622" y="125" font-family="ui-monospace, monospace" font-size="9" fill="#34d399">1st</text>
  <text x="622" y="237" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">2nd</text>
  <text x="622" y="349" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">3rd</text>

  <!-- lane 1: back -->
  <g class="step s4">
    <rect x="658" y="98" width="304" height="76" rx="14" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="678" y="126" font-family="ui-monospace, monospace" font-size="12" fill="#34d399">BACKEND · NestJS</text>
    <text x="678" y="146" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">owns the contract: it exposes it</text>
    <text x="678" y="163" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">specs/012-orders/ · same R#</text>
    <text x="946" y="126" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#a78bfa">Claude Code</text>
  </g>

  <!-- lane 2: web -->
  <g class="step s5">
    <rect x="658" y="206" width="304" height="76" rx="14" fill="none" stroke="#453768" stroke-width="2"/>
    <text x="678" y="234" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">WEB · Angular</text>
    <text x="678" y="254" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">consumer: it reads it, never redefines it</text>
    <text x="678" y="271" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">specs/012-orders/ · same R#</text>
    <text x="946" y="234" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#a78bfa">Claude Code</text>
  </g>

  <!-- lane 3: mobile -->
  <g class="step s6">
    <rect x="658" y="318" width="304" height="76" rx="14" fill="none" stroke="#453768" stroke-width="2"/>
    <text x="678" y="346" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">MOBILE · Flutter</text>
    <text x="678" y="366" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">consumer: it reads it, never redefines it</text>
    <text x="678" y="383" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">specs/012-orders/ · same R#</text>
    <text x="946" y="346" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#fb7185">Codex</text>
  </g>

  <!-- bottom band: the arithmetic -->
  <line x1="40" y1="428" x2="960" y2="428" stroke="#2a2140" stroke-width="1"/>
  <text x="40" y="456" font-family="ui-monospace, monospace" font-size="11" fill="#fb7185">no contract · the backend answers well, but answers in private</text>
  <g class="tangle">
    <text x="40" y="478" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">back → web (in one chat)    ·    back → mobile (in another, another day)</text>
    <text x="40" y="498" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">and what each screen shows: nobody's — same 409, two behaviours</text>
  </g>
  <text x="540" y="456" font-family="ui-monospace, monospace" font-size="11" fill="#34d399">with a contract · one response, three identical readings</text>
  <text x="540" y="478" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">the requirement says what MUST HAPPEN, not just what travels the wire</text>
  <text x="540" y="498" font-family="ui-monospace, monospace" font-size="9" fill="#8a7fb0">a fourth lane is one more reading, not another memo to forward</text>
</svg>

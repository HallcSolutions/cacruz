<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-label="El ciclo del TDD: rojo, verde y refactor. El requisito entra primero y el código sale al final">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b16"/><stop offset="1" stop-color="#181329"/>
    </linearGradient>
    <marker id="vio" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="grn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#34d399"/>
    </marker>
    <marker id="red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#fb7185"/>
    </marker>
  </defs>
  <style>
    .flow { stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
    .slow { animation-duration: 2.4s; }
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 4.5s ease-in-out infinite; }
    .b2 { animation-delay: 1.5s; } .b3 { animation-delay: 3s; }
    @keyframes dash { to { stroke-dashoffset: -56; } }
    @keyframes beat { 0%,66%,100% { transform: scale(1); opacity:.75 } 22% { transform: scale(1.05); opacity:1 } }
  </style>

  <rect width="1000" height="480" fill="url(#bg)"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="30" fill="#ece7fb">El ciclo del TDD</text>
  <text x="40" y="80" font-family="ui-monospace, monospace" font-size="14" fill="#8a7fb0">Test-Driven Development · «desarrollo guiado por pruebas»</text>

  <!-- Entrada: el requisito -->
  <rect x="40" y="205" width="160" height="100" rx="12" fill="none" stroke="#332a52" stroke-width="2"/>
  <text x="120" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">REQUISITO</text>
  <text x="120" y="263" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">R# · WHEN… SHALL…</text>
  <text x="120" y="285" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#5b4d80">lo apruebo yo</text>

  <path d="M 208 248 C 300 240, 330 155, 456 145" fill="none" class="flow slow" stroke="#5b4d80" stroke-width="2" marker-end="url(#vio)"/>
  <text x="300" y="232" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">de aquí sale el test</text>

  <!-- El bucle -->
  <g class="beat">
    <circle cx="520" cy="145" r="58" fill="none" stroke="#fb7185" stroke-width="2.5"/>
    <text x="520" y="132" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#fb7185">1 · ROJO</text>
    <text x="520" y="151" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">el test falla</text>
    <text x="520" y="167" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">aún no hay código</text>
  </g>

  <g class="beat b2">
    <circle cx="650" cy="355" r="58" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <text x="650" y="342" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">2 · VERDE</text>
    <text x="650" y="361" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">código mínimo</text>
    <text x="650" y="377" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">el test pasa</text>
  </g>

  <g class="beat b3">
    <circle cx="390" cy="355" r="58" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="390" y="342" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">3 · REFACTOR</text>
    <text x="390" y="361" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">ordenas</text>
    <text x="390" y="377" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">sigue en verde</text>
  </g>

  <line x1="550" y1="196" x2="620" y2="304" class="flow" stroke="#34d399" stroke-width="2.5" marker-end="url(#grn)"/>
  <text x="600" y="250" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">escribes el código</text>

  <line x1="592" y1="355" x2="448" y2="355" class="flow" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#vio)"/>
  <text x="520" y="337" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#a78bfa">limpias sin romper</text>

  <line x1="420" y1="304" x2="490" y2="196" class="flow slow" stroke="#fb7185" stroke-width="2.5" marker-end="url(#red)"/>
  <text x="440" y="250" text-anchor="end" font-family="ui-monospace, monospace" font-size="10" fill="#fb7185">siguiente prueba</text>

  <text x="520" y="262" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#5b4d80">una vuelta</text>
  <text x="520" y="282" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#ece7fb">= un requisito R#</text>

  <!-- Salida: el código -->
  <line x1="706" y1="330" x2="796" y2="284" class="flow" stroke="#34d399" stroke-width="2" marker-end="url(#grn)"/>

  <rect x="800" y="205" width="160" height="100" rx="12" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="880" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#34d399">CÓDIGO</text>
  <text x="880" y="263" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8a7fb0">escrito para cumplir</text>
  <text x="880" y="285" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#ece7fb">un test que ya existía</text>

  <!-- Cierre -->
  <rect x="40" y="420" width="920" height="44" rx="12" fill="none" stroke="#453768" stroke-width="2"/>
  <text x="500" y="448" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">TDD = la prueba existe antes que el código al que juzga · escribir tests al terminar no es TDD</text>
</svg>

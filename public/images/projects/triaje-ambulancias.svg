<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="triaje-ambulancias">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0a1a"/><stop offset="1" stop-color="#1b1330"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <path id="route" d="M212 268 C 284 268, 286 150, 372 150 S 520 96, 620 96"/>
  </defs>
  <style>
    .street { stroke: #2b2247; stroke-width: 2; }
    .ping { animation: ping 2.6s ease-out infinite; transform-origin: 150px 268px; }
    .ping2 { animation-delay: 1.3s; }
    .route { stroke-dasharray: 7 11; animation: run 1.6s linear infinite; }
    .reject { animation: reject 5s ease-in-out infinite; }
    .pick { animation: pick 5s ease-in-out infinite; }
    .strike { stroke-dasharray: 133; stroke-dashoffset: 133; animation: strike 5s ease-in-out infinite; }
    @keyframes run { to { stroke-dashoffset: -36; } }
    @keyframes ping { 0% { r: 10; opacity: .75; } 100% { r: 46; opacity: 0; } }
    @keyframes reject { 0%, 35% { opacity: .85; } 55%, 100% { opacity: .25; } }
    @keyframes pick { 0%, 45% { opacity: .35; } 65%, 100% { opacity: 1; } }
    @keyframes strike { 0%, 40% { stroke-dashoffset: 133; } 60%, 95% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 133; } }
  </style>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="660" cy="86" r="170" fill="#34d399" opacity="0.07"/>

  <!-- trama de calles -->
  <g class="street" opacity="0.65">
    <path d="M96 76v250M244 60v266M392 60v210M540 60v150M688 46v130"/>
    <path d="M70 118h660M70 196h560M70 274h360"/>
  </g>

  <!-- incidente -->
  <circle class="ping" cx="150" cy="268" r="10" fill="none" stroke="#fb7185" stroke-width="2.5"/>
  <circle class="ping ping2" cx="150" cy="268" r="10" fill="none" stroke="#fb7185" stroke-width="2.5"/>
  <circle cx="150" cy="268" r="11" fill="#fb7185"/>

  <!-- ruta hasta el hospital elegido -->
  <use href="#route" fill="none" stroke="#3a2f5e" stroke-width="3" stroke-linecap="round"/>
  <use href="#route" class="route" fill="none" stroke="url(#ac)" stroke-width="3" stroke-linecap="round"/>

  <!-- ambulancia recorriendo la ruta -->
  <g>
    <g transform="translate(-21 -13)">
      <rect width="42" height="26" rx="7" fill="#0e0a1a" stroke="#a78bfa" stroke-width="2.5"/>
      <path d="M21 8v10M16 13h10" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear">
      <mpath href="#route"/>
    </animateMotion>
  </g>

  <!-- hospital más cercano, descartado -->
  <g class="reject" transform="translate(336 208)">
    <rect width="62" height="62" rx="16" fill="none" stroke="#6b5f8f" stroke-width="2.5"/>
    <path d="M31 17v28M17 31h28" stroke="#6b5f8f" stroke-width="6" stroke-linecap="round"/>
  </g>
  <path class="strike" d="M320 284 L414 190" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>

  <!-- hospital con el servicio -->
  <g class="pick" transform="translate(590 66)">
    <rect width="62" height="62" rx="16" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <path d="M31 17v28M17 31h28" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="80" y="392" font-family="ui-monospace, monospace" font-size="24" fill="#8a7fb0">unidad_acv · confidence 1.00 · 216 ms</text>
  <text x="80" y="448" font-family="Georgia, serif" font-size="34" fill="#ece7fb" font-style="italic">to the hospital that can treat them</text>
</svg>
